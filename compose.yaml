services:
  api:
    image: ${APP_IMAGE:?APP_IMAGE must name an image tagged with a commit SHA}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:8000"
      - "127.0.0.1:${GRPC_PORT:-50051}:50051"
    volumes:
      - api-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  api-data:
