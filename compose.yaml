services:
  api:
    image: ${APP_IMAGE:?APP_IMAGE must name an image tagged with a commit SHA}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:8000"
      - "127.0.0.1:${GRPC_PORT:-50051}:50051"
    environment:
      DATA_DIR: /app/data
      # Persistent metadata only; pixel downloads use the separate file cache.
      IRSA_MIRROR_MAX_INDEX_BYTES: "8589934592"
      PROCESSING_URL: http://pipeline:8002
    depends_on:
      pipeline:
        condition: service_healthy
    volumes:
      - api-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  pipeline:
    image: ${APP_IMAGE:?APP_IMAGE must name an image tagged with a commit SHA}
    pull_policy: never
    restart: unless-stopped
    working_dir: /app/pipeline
    command: ["/opt/inference-venv/bin/python", "-m", "uvicorn", "unification.app:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      PYTHONPATH: /app:/app/pipeline
      IRSA_DISCOVERY_URL: http://api:8000/api/irsa/discovery
      UNIFICATION_DATA_ROOT: /tmp/spherex_cutouts
    volumes:
      - api-data:/tmp/spherex_cutouts
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --max-time 2 http://127.0.0.1:8002/health | grep -Fq '\"status\":\"ok\"'"]
      interval: 3s
      timeout: 3s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  api-data:
