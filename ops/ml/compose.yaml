services:
  ml-inference:
    image: ${ML_IMAGE:?ML_IMAGE must name an image tagged with a commit SHA}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8001}:8001"
    environment:
      VERIFICATIONS_DB_PATH: /app/data/verifications.sqlite
      PLANETX_DB_PATH: /app/data/planetx_catalogue.db
      XDG_CACHE_HOME: /tmp/cache
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    volumes:
      - ml-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=2))['status']=='ok'; urllib.request.urlopen('http://127.0.0.1:8001/api/catalogue/kpis',timeout=2).close(); urllib.request.urlopen('http://127.0.0.1:8001/api/motion/verifications',timeout=2).close()"]
      interval: 5s
      timeout: 8s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  ml-data:
