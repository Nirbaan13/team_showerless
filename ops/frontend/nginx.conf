server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /frontend-version.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Enable unrestricted embedding on external websites, educational portals, and research blogs
    add_header Content-Security-Policy "frame-ancestors *;" always;

    # The frontend prefixes API calls with /backend; remove that prefix.
    location /backend/ {
        proxy_pass http://host.docker.internal:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location /api/motion/ {
        proxy_pass http://host.docker.internal:8001;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        client_max_body_size 2m;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }
    location /api/catalogue/ {
        proxy_pass http://host.docker.internal:8001;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        client_max_body_size 2m;
    }
    # API manifests return stable /api/... URLs for FITS, previews and events.
    location /api/ {
        proxy_pass http://host.docker.internal:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
