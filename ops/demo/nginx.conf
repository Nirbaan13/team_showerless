server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /frontend-version.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    # PHP is executed only by Hostinger; never expose its source on Nginx.
    location = /api-proxy.php { return 404; }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    # Enable unrestricted embedding on external websites, educational portals, and research blogs
    add_header Content-Security-Policy "frame-ancestors *;" always;

    # The frontend prefixes API calls with /backend; remove that prefix.
    location /backend/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    # Persistent registry/discussion operations belong to the deployed ML service.
    # Image generation and scientific catalogue queries retain their native APIs.
    location ^~ /api/motion/coadd/ {
        default_type application/json;
        return 501 '{"error":"unavailable_in_real_demo","message":"Synthetic coadd imagery is disabled in the real-data demo."}';
    }
    location = /api/motion/cutout/render {
        default_type application/json;
        return 501 '{"error":"unavailable_in_real_demo","message":"Synthetic cutout rendering is disabled in the real-data demo."}';
    }
    location = /api/motion/spectrum {
        default_type application/json;
        return 501 '{"error":"unavailable_in_real_demo","message":"Synthetic spectra are disabled in the real-data demo."}';
    }
    location = /api/motion/catalog {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }
    location ~ ^/api/motion/(verifications|candidates)(/|$) {
        proxy_pass http://ml-inference:8001;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        client_max_body_size 2m;
    }
    location = /api/catalogue/auto-submit {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
    }
    location ~ ^/api/catalogue/candidates/[^/]+/submissions$ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
    }
    location /api/motion/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        client_max_body_size 2m;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }
    location /api/catalogue/ {
        proxy_pass http://ml-inference:8001;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        client_max_body_size 2m;
    }
    # API manifests return stable /api/... URLs for FITS, previews and events.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
    # Public, checksummed archive observations only; databases remain outside /demo.
    location /demo/ {
        alias /demo-data/demo/;
        autoindex off;
        add_header Cache-Control "no-store" always;
        limit_except GET HEAD { deny all; }
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
