  <g id="text_17">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #414a54" x="38.88" y="54.9" transform="rotate(-0 38.88 54.9)">V4 − frozen C13 scorer · shared coverage-preserving preparation</text>
  </g>
  <g id="text_18">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="38.88" y="355.752" transform="rotate(-0 38.88 355.752)">Dots: candidate minus baseline macro recovery. Bars: paired 95% bootstrap intervals from the frozen report.</text>
  </g>
  <g id="text_19">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="38.88" y="375.516" transform="rotate(-0 38.88 375.516)">Native: 3,240 trials clustered within 12 parents. Synthetic: 5,993 truths in 3,000 planned fields;</text>
  </g>
  <g id="text_20">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="38.88" y="393.084" transform="rotate(-0 38.88 393.084)">macro recall averages 2,400 truth-containing fields. Bootstrap: 10,000 paired parent/field resamples.</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #414a54" x="38.88" y="417.24" transform="rotate(-0 38.88 417.24)">Injection-ranking evidence, not real discoveries, survey sensitivity, or calibrated probabilities.</text>
  </g>
