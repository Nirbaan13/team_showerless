# AI-generated OpenAPI specification.
openapi: 3.1.0
info:
  title: SPHEREx Backend API
  version: 0.1.0
  description: |
    Proposed backend contract. Search is independent from data preparation.
    The observation endpoints replace POST /api/downloads and select the
    processing mode through the URL. Download status, events, chunk data,
    and preview endpoints are retained.
    The downloads module provides federated discovery and asynchronous downloads.
    Current archive and legacy IRSA URLs remain stable during module migration.
    All downloaded products, calibration files and generated previews share a
    persistent LRU budget. Active transfers and streaming readers hold leases.
    URLs may be returned before their resources are ready. Clients must use
    resource status or readiness events before fetching image or FITS data.
    Optional observed_after and observed_before timestamps constrain observation
    time for every query geometry. The backend converts them to Modified Julian
    Dates (MJD) and sends IRSA TIME=<start_mjd> <end_mjd>. An omitted bound becomes
    -Inf or +Inf; when both bounds are omitted, no TIME filter is sent.
    Preparing observations retrieves server-side IRSA spatial cutouts of the
    selected Spectral Image MEFs. The returned FITS retains mission extensions
    and its native pixel orientation. An enclosing cutout covers the requested
    region without reprojection or exact polygon masking; it can be clipped at
    the parent image boundary. Failed cutouts never trigger a full-image fallback.
servers:
  - url: http://144.124.238.101
tags:
  - name: Observations
  - name: Downloads
  - name: Chunks
  - name: Equipment
  - name: Analyses
  - name: Federated Downloads
  - name: Image unification
paths:
  /api/image-unifications:
    post:
      tags:
      - Image unification
      operationId: createImageUnification
      summary: Prepare completed downloaded images as a versioned ML bundle
      description: 'Resolves server-issued asset or native chunk IDs and creates a durable job.
  
        Sky mode registers pixels on an explicit ICRS TAN grid; pixel mode produces
  
        an explicitly uncalibrated grid. Physical images, validity, variance,
  
        real exposure times and provenance are retained alongside a finite tensor.
  
        Registration does not establish comparable PSFs or production ML eligibility.
  
        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageUnificationRequest'
      responses:
        '202':
          description: Durable job admitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUnificationJob'
        '422':
          description: Invalid selection, unsupported options or unknown properties
        '503':
          description: Job admission or shared disk capacity exhausted
  /api/image-unifications/{id}:
    get:
      tags:
      - Image unification
      operationId: getImageUnification
      summary: Read durable preparation status and completed artifact URL
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Current durable state; a completed cache artifact may expire
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUnificationJob'
        '404':
          description: Unknown job
  /api/image-unifications/{id}/artifact:
    get:
      tags:
      - Image unification
      operationId: getImageUnificationArtifact
      summary: Download a completed pickle-free NPZ with embedded JSON manifest
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Version 1 numeric arrays and provenance; at most 192 MiB compressed
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Unknown job
        '409':
          description: Preparation has not completed or the cache artifact is unavailable
  /api/observations-search:
    get:
      tags:
      - Federated Downloads
      operationId: searchArchiveObservations
      summary: Find observations and return their stable IDs without downloading files
      description: Metadata search only. The client chooses observation IDs from this response and submits them
        to observations-download. No image download job is created. Provider completeness and independent failures
        are reported in outcomes. Detector and channel filters are source-specific and are not accepted here.
      parameters:
      - $ref: '#/components/parameters/RightAscension'
      - $ref: '#/components/parameters/Declination'
      - name: radius_degrees
        in: query
        required: true
        schema:
          type: number
          exclusiveMinimum: 0
          maximum: 180
      - name: providers
        in: query
        required: true
        style: form
        explode: false
        schema:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        example:
        - irsa-spherex
      - name: product_kinds
        in: query
        style: form
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveProductKind'
          default:
          - image
      - $ref: '#/components/parameters/ObservedAfter'
      - $ref: '#/components/parameters/ObservedBefore'
      - name: limit_per_provider
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      responses:
        '200':
          description: List of observations; each id and frame_id identifies the same server-known observation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationsFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          description: Metadata search queue is full
        '504':
          description: Metadata search deadline exceeded
  /api/observations-download:
    post:
      tags:
      - Federated Downloads
      operationId: downloadSelectedObservations
      summary: Download exactly the observation IDs selected by the client
      description: Accepts observation_ids returned by observations-search. No discovery is performed, no matching
        observations are added automatically, and geometry cannot replace the ID selection. Optional delivery
        controls original files or a circle cutout of each selected observation. Returns the common job/chunk/progress
        contract immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObservationSelection'
            example:
              observation_ids:
              - ID_FROM_OBSERVATIONS_SEARCH
              delivery:
                mode: require_cutout
                region:
                  type: circle
                  ra_degrees: 266.4
                  dec_degrees: -29.0
                  radius_degrees: 0.002
      responses:
        '202':
          description: Accepted selection; chunks contain pending resource links
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationDownload'
        '200':
          description: The accepted selection already reached a terminal state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationDownload'
        '404': &id002
          $ref: '#/components/responses/NotFound'
        '422': &id003
          $ref: '#/components/responses/InvalidRequest'
        '429':
          description: Download queue is full
  /api/observations-download/{id}:
    parameters: &id001
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Federated Downloads
      operationId: getSelectedObservationsDownload
      summary: Get observations, chunk readiness, progress, URLs and errors
      responses:
        '200':
          description: Current common download manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationDownload'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/observations-download/{id}/events:
    parameters: *id001
    get:
      tags:
      - Federated Downloads
      operationId: watchSelectedObservationsDownload
      summary: Stream common job and compact chunk events
      description: job.updated and job.completed contain the common manifest with job_id. chunk.ready and chunk.failed
        contain the common chunk fields, chunk_id, job_id and progress. Without Last-Event-ID, starts with the
        current manifest; with it, replays committed updates. Disconnecting does not cancel downloading.
      parameters:
      - name: Last-Event-ID
        in: header
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: SSE progress until terminal completion
          content:
            text/event-stream:
              schema:
                type: string
        '404': *id002
        '422': *id003
  /api/observations-download/chunks/{id}:
    parameters: *id001
    get:
      tags:
      - Federated Downloads
      operationId: getSelectedObservationChunk
      summary: Retrieve the selected native FITS product when ready
      responses:
        '200':
          description: Validated native FITS or native gzip FITS; the response holds a cache reader lease
          content:
            application/fits:
              schema:
                type: string
                format: binary
            application/gzip:
              schema:
                type: string
                format: binary
        '202':
          $ref: '#/components/responses/PendingResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Selected product failed, was skipped or left the cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveFailure'
  /api/observations-download/chunks/{id}/preview:
    parameters: *id001
    get:
      tags:
      - Federated Downloads
      operationId: getSelectedObservationPreview
      summary: Check preview availability for a known selected chunk
      description: Native archive downloads currently expose preview_status=unavailable. This endpoint returns
        a typed unavailable response and does not fabricate a PNG.
      responses:
        '409':
          description: Native preview generation is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveFailure'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/archives:
    get:
      tags:
      - Federated Downloads
      operationId: listArchives
      summary: List independent archive capabilities and qualification restrictions
      responses:
        '200':
          description: Inventory includes unavailable and authentication-dependent providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArchiveInventory'
  /api/archive-searches:
    post:
      deprecated: true
      tags:
      - Federated Downloads
      operationId: createArchiveSearch
      summary: Queue a durable federated metadata search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveQuery'
      responses:
        '202':
          description: Accepted; poll status_url for records and independent provider
            outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveAcceptedJob'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          description: Archive search queue capacity exceeded
  /api/archive-searches/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      deprecated: true
      tags:
      - Federated Downloads
      operationId: getArchiveSearch
      summary: Get job status and a bounded local snapshot page
      description: 'Local pagination is independent of upstream completeness. An opaque
        cursor

        belongs to this persisted snapshot generation. If records change, restart

        local pagination after HTTP 409. Truncation never implies a continuation.

        '
      parameters:
      - name: cursor
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Normalized records and independent provider outcomes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveSearchPage'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Cursor belongs to a different snapshot generation
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /api/archive-searches/{id}/continue:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      deprecated: true
      tags:
      - Federated Downloads
      operationId: continueArchiveSearch
      summary: Resume one genuine provider continuation
      description: 'Only providers with has_continuation=true can resume. The initial
        qualified

        production profiles do not advertise upstream pagination. Truncated results

        can be narrowed with a new search; arbitrary offsets are never fabricated.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - provider
              properties:
                provider:
                  type: string
      responses:
        '202':
          description: Continuation queued on the same job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveAcceptedJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Job is already active
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /api/archive-downloads:
    post:
      deprecated: true
      tags:
      - Federated Downloads
      operationId: createArchiveDownload
      summary: Queue selected server-known native science products
      description: 'Submit record IDs from archive search. Arbitrary upstream URLs are
        rejected.

        Foreign native products have analysisEligible=false. A NoContent subset is

        skipped; prefer_cutout never fetches a large original after a failed subset.

        If no cutout is advertised, prefer_cutout can choose an original explicitly

        supported by the provider. require_cutout never chooses an original.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - record_ids
              properties:
                record_ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items:
                    type: string
                delivery:
                  $ref: '#/components/schemas/ArchiveDelivery'
      responses:
        '202':
          description: Accepted immediately; status_url contains pending chunks and events_url streams progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveAcceptedJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          description: Archive download queue capacity exceeded
  /api/archive-downloads/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      deprecated: true
      tags:
      - Federated Downloads
      operationId: getArchiveDownload
      summary: Get persisted per-asset state, provenance and local artifact URLs
      responses:
        '200':
          description: Durable native-product download state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveDownload'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/archive-downloads/{id}/events:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      deprecated: true
      tags: [Federated Downloads]
      operationId: watchArchiveDownload
      summary: Stream persistent download progress and chunk readiness
      description: |
        Without Last-Event-ID, emits a current job.updated snapshot, followed by
        committed updates. With Last-Event-ID, replays all later committed events.
        Event IDs are monotonic within this download. Data is an ArchiveDownload.
        Events: job.updated, chunk.started, chunk.ready, chunk.failed, job.completed.
        The stream closes after job.completed. Disconnecting leaves accepted work
        running. A completed replay with no newer events closes immediately.
      parameters:
      - name: Last-Event-ID
        in: header
        required: false
        description: Previously received event ID; must not exceed the latest committed ID
        schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: Unbuffered ordered SSE stream
          content:
            text/event-stream:
              schema: {type: string}
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /api/archive-assets/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      deprecated: true
      tags:
      - Federated Downloads
      operationId: getArchiveAsset
      summary: Retrieve a server-known artifact or its pending state
      description: Native gzip products retain gzip bytes. This route does not run SPHEREx
        processing.
      responses:
        '200':
          description: Structurally validated native FITS or gzip FITS bytes
          content:
            application/fits:
              schema:
                type: string
                format: binary
            application/gzip:
              schema:
                type: string
                format: binary
        '202':
          $ref: '#/components/responses/PendingResource'
        '409':
          description: Selected product failed, was skipped, or has left the cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveFailure'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/spectrum:
    get:
      tags: [Pipeline]
      operationId: getPipelineSpectrum
      summary: Request measured spectral points from the existing Python service
      description: >-
        Scala validates the request and calls the unchanged Python HTTP endpoint.
        Returns its completed JSON synchronously; no 202 or download-job protocol
        is introduced. WCS-WAVE aperture points are visualization approximations,
        not independently calibrated science spectra. Only ZODI-subtracted spectra
        are implemented by the existing Python endpoint. Python failures remain
        gateway errors; no synthetic bands or molecules are added by Scala.
      parameters:
        - {name: ra, in: query, required: true, schema: {type: number, minimum: 0, exclusiveMaximum: 360}}
        - {name: dec, in: query, required: true, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: radius_pix, in: query, schema: {type: number, minimum: 0.5, maximum: 10, default: 2}}
        - {name: size_arcmin, in: query, schema: {type: number, minimum: 0.5, maximum: 10, default: 1.5}}
        - {name: max_frames, in: query, schema: {type: integer, minimum: 1, maximum: 400, default: 120}}
        - {name: candidate_id, in: query, schema: {type: string, maxLength: 256}, description: Display label only}
        - {name: subtraction, in: query, schema: {type: string, enum: [zodi_subtracted], default: zodi_subtracted}}
      responses:
        '200':
          description: Original completed spectral JSON from the team service
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PipelineSpectrum'}
        '404': {description: Python found no usable data}
        '422': {description: Invalid parameters or unsupported processing option}
        '502': {description: Python failed or returned invalid data}
        '503': {description: Python service unavailable}
        '504': {description: Python HTTP request exceeded the backend deadline}
  /api/cutout/search:
    post:
      tags: [Pipeline]
      operationId: searchPipelineCutouts
      summary: Call the existing Python cutout search
      description: Detector filtering is not implemented by this Python operation and is rejected explicitly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ra, dec]
              properties:
                ra: {type: number, minimum: 0, exclusiveMaximum: 360}
                dec: {type: number, minimum: -90, maximum: 90}
                size_arcmin: {type: number, minimum: 0.01, maximum: 600, default: 3}
                collection: {type: string, default: spherex_dr1}
      responses:
        '200':
          description: Original search results
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '422': {description: Invalid search request}
        '502': {description: Python search failure, including errors reported in a 200 body}
        '503': {description: Python service unavailable}
        '504': {description: Python request timed out}
  /api/cutout/render:
    get:
      tags: [Pipeline]
      operationId: renderPipelineCutout
      summary: Obtain a PNG from the existing Python renderer
      description: >-
        The Python service selects the first matching exposure itself. This
        coordinate-based preview is separate from a native Scala chunk ID and
        does not claim that it renders a particular downloaded frame.
      parameters:
        - {name: ra, in: query, required: true, schema: {type: number, minimum: 0, exclusiveMaximum: 360}}
        - {name: dec, in: query, required: true, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: size_arcmin, in: query, schema: {type: number, minimum: 0.01, maximum: 600, default: 3}}
        - {name: subtraction, in: query, schema: {type: string, enum: [raw_calibrated, zodi_subtracted], default: raw_calibrated}}
      responses:
        '200':
          description: Original PNG, validated for content type and signature
          content:
            image/png:
              schema: {type: string, format: binary}
        '404': {description: No matching coverage}
        '422': {description: Invalid render parameters}
        '502': {description: Python rendering failed or returned an invalid PNG}
        '503': {description: Python service unavailable}
        '504': {description: Python request timed out}
  /api/spectrum/measure:
    post:
      tags: [Pipeline]
      operationId: measurePipelineCachedSpectrum
      summary: Measure existing cutouts in the Python service cache
      description: >-
        Accepts cache filenames only, never caller filesystem paths. This route
        uses the existing Python cache and does not import native Scala jobs into
        it or change the Python file-handling implementation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ra, dec]
              properties:
                ra: {type: number, minimum: 0, exclusiveMaximum: 360}
                dec: {type: number, minimum: -90, maximum: 90}
                radius_pix: {type: number, minimum: 0.5, maximum: 10, default: 2}
                cutout_paths:
                  type: array
                  maxItems: 120
                  items: {type: string, maxLength: 256, pattern: '^[A-Za-z0-9_.-]+$'}
      responses:
        '200':
          description: Original measured rows, or original empty-cache response
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '422': {description: Invalid aperture or cache filenames}
        '502': {description: Python measurement failed}
        '503': {description: Python service unavailable}
        '504': {description: Python request timed out}
  /api/observations/meta:
    get:
      tags: [Observations]
      operationId: getObservationMetadata
      summary: Get expanded metadata for a previously discovered frame
      description: |
        Supply frame_id returned by search or a download job. Combines available
        SIA metadata, additional TAP fields and FITS HDU headers. FITS headers are
        read only when the FITS is already cached; this request never
        downloads a science image. Each source reports its own availability or
        error. Partial metadata remains useful when an external source fails.
        Cached cutout headers are labelled fits.spatial_subset=true; SIA and TAP
        metadata continue to describe the parent spectral image.
      parameters:
        - name: frame_id
          in: query
          required: true
          description: Frame identifier returned by observation search
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Available metadata with explicit source status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationMetadata'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /api/equipment:
    get:
      tags: [Equipment]
      operationId: getEquipment
      summary: Get SPHEREx equipment and available calibration products
      description: |
        Discovers actual calibration files in the official IRSA public archive
        mirror. Results are cached by release and detector. Calibration versions
        are listed explicitly; a catalogue entry does not imply applicability to
        every frame. Files are fetched through the calibration resource endpoint.
      parameters:
        - name: release
          in: query
          schema: {type: string, enum: [DR1, QR3], default: DR1}
        - $ref: '#/components/parameters/Detector'
      responses:
        '200':
          description: Equipment details and discovered calibration catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentCatalogue'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ArchiveUnavailable'
  /api/equipment/calibrations/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Equipment]
      operationId: getCalibrationFile
      summary: Download a calibration file through the backend cache
      description: |
        Supply a calibration file ID returned by equipment. The backend resolves
        its persisted archive identity, downloads the original file when needed
        and serves the cached bytes. Arbitrary archive URLs are not accepted.
      responses:
        '200':
          description: Original calibration file bytes (FITS, YAML, ECSV or another listed format)
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ArchiveUnavailable'
  /api/observationsDeep:
    get:
      tags: [Observations]
      operationId: prepareDeepObservations
      summary: Prepare native observations from the SPHEREx deep surveys
      description: |
        Queries spherex_dr1_deep and spherex_qr3_deep. Supply exactly one complete
        geometry: center RA/Dec with optional width/height, four range boundaries,
        or verices_degrees polygon coordinates. Geometry families cannot be mixed.
        Dates, detector and channel use the same filters as other preparation
        endpoints. Returns the existing asynchronous download job, SSE events and
        chunk URLs. Query survey is deep; each chunk is one IRSA spatial cutout
        from a matching parent spectral image, within its native boundaries.
      parameters:
        - name: right_ascension_deg
          in: query
          schema: {type: number, minimum: 0, exclusiveMaximum: 360}
        - name: declination_deg
          in: query
          schema: {type: number, minimum: -90, maximum: 90}
        - name: width_arcmin
          in: query
          description: Center geometry only; defaults to3 when omitted
          schema: {type: number, exclusiveMinimum: 0}
        - name: height_arcmin
          in: query
          description: Center geometry only; defaults to3 when omitted
          schema: {type: number, exclusiveMinimum: 0}
        - name: right_ascension_min_deg
          in: query
          schema: {type: number, minimum: 0, maximum: 360}
        - name: right_ascension_max_deg
          in: query
          schema: {type: number, minimum: 0, maximum: 360}
        - name: declination_min_deg
          in: query
          schema: {type: number, minimum: -90, maximum: 90}
        - name: declination_max_deg
          in: query
          schema: {type: number, minimum: -90, maximum: 90}
        - name: verices_degrees
          in: query
          style: form
          explode: false
          schema:
            $ref: '#/components/schemas/PolygonCoordinates'
        - $ref: '#/components/parameters/Detector'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/ObservedAfter'
        - $ref: '#/components/parameters/ObservedBefore'
      responses:
        '200':
          $ref: '#/components/responses/ReadyJob'
        '202':
          $ref: '#/components/responses/PendingJob'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ArchiveUnavailable'
  /api/observations/search:
    post:
      tags: [Observations]
      operationId: searchObservations
      summary: Search archive observations without downloading image data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkyQuery'
      responses:
        '200':
          description: Matching observation metadata
          content:
            application/json:
              schema:
                type: object
                required: [observations]
                properties:
                  observations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Observation'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ArchiveUnavailable'
  # overenginering: keep the legacy center/width/height endpoint for compatibility.
  /api/observations/default:
    get:
      tags: [Observations]
      operationId: prepareDefaultObservations
      summary: Prepare calibrated observations without additional subtraction
      description: |
        Immediately returns a download job and stable future resource URLs.
        Discovery and preparation run in the background. Repeated identical
        requests reuse the existing active job or cached result.
      parameters:
        - $ref: '#/components/parameters/RightAscension'
        - $ref: '#/components/parameters/Declination'
        - $ref: '#/components/parameters/Width'
        - $ref: '#/components/parameters/Height'
        - $ref: '#/components/parameters/Detector'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/ObservedAfter'
        - $ref: '#/components/parameters/ObservedBefore'
      responses:
        '200':
          $ref: '#/components/responses/ReadyJob'
        '202':
          $ref: '#/components/responses/PendingJob'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /api/observations/range:
    get:
      tags: [Observations]
      operationId: prepareRangeObservations
      summary: Prepare observations intersecting a rectangular sky region
      description: |
        Uses the same default preparation, download job, chunk statuses, cache,
        and resource URLs as observations/default, without a center or dimensions.
        Discovery and preparation run in the background. Repeated identical
        requests reuse the existing active job or cached result.
        The backend constructs the IRSA query as
        POS=RANGE ra_min ra_max dec_min dec_max.
        All coordinates are ICRS degrees. Native IRSA image boundaries are retained;
        the service does not introduce its own tile grid.
      parameters:
        - name: right_ascension_min_deg
          in: query
          required: true
          description: Lower right ascension boundary, in ICRS degrees
          schema: {type: number, minimum: 0, maximum: 360}
          example: 210.80
        - name: right_ascension_max_deg
          in: query
          required: true
          description: Upper right ascension boundary, in ICRS degrees
          schema: {type: number, minimum: 0, maximum: 360}
          example: 210.81
        - name: declination_min_deg
          in: query
          required: true
          description: Lower declination boundary, in ICRS degrees
          schema: {type: number, minimum: -90, maximum: 90}
          example: 54.34
        - name: declination_max_deg
          in: query
          required: true
          description: Upper declination boundary, in ICRS degrees
          schema: {type: number, minimum: -90, maximum: 90}
          example: 54.35
        - $ref: '#/components/parameters/Detector'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/ObservedAfter'
        - $ref: '#/components/parameters/ObservedBefore'
      responses:
        '200':
          $ref: '#/components/responses/ReadyJob'
        '202':
          $ref: '#/components/responses/PendingJob'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /api/observations/polygon:
    get:
      tags: [Observations]
      operationId: preparePolygonObservations
      summary: Prepare observations intersecting a sky polygon
      description: |
        Uses the same default preparation, download job, chunk statuses, cache,
        and resource URLs as observations/default, without a center or dimensions.
        Discovery and preparation run in the background. Repeated identical
        requests reuse the existing active job or cached result.
        The backend constructs POS=POLYGON from the supplied coordinate pairs.
        All coordinates are ICRS degrees. Native IRSA image boundaries are retained;
        the service does not introduce its own tile grid.
      parameters:
        - name: verices_degrees
          in: query
          required: true
          description: |
            Comma-separated coordinates in the order ra1,dec1,ra2,dec2,ra3,dec3,...
            Supply at least three vertices in boundary order for a convex spherical
            polygon. The number of coordinates must be even. Each right ascension
            must be between 0 and 360 degrees; each declination must be between
            -90 and 90 degrees. Coordinate pairing and polygon validity are checked
            by the backend in addition to schema validation.
          style: form
          explode: false
          schema:
            $ref: '#/components/schemas/PolygonCoordinates'
          example: [210.80, 54.34, 210.81, 54.34, 210.81, 54.35, 210.80, 54.35]
        - $ref: '#/components/parameters/Detector'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/ObservedAfter'
        - $ref: '#/components/parameters/ObservedBefore'
      responses:
        '200':
          $ref: '#/components/responses/ReadyJob'
        '202':
          $ref: '#/components/responses/PendingJob'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /api/observations/zodi-reference-subtracted:
    get:
      tags: [Observations]
      operationId: prepareZodiSubtractedObservations
      summary: Prepare observations with zodiacal reference subtraction
      description: |
        Uses the processing pipeline to prepare the requested mode.
        Immediately returns a job; it does not wait for processing to finish.
      parameters:
        - $ref: '#/components/parameters/RightAscension'
        - $ref: '#/components/parameters/Declination'
        - $ref: '#/components/parameters/Width'
        - $ref: '#/components/parameters/Height'
        - $ref: '#/components/parameters/Detector'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/ObservedAfter'
        - $ref: '#/components/parameters/ObservedBefore'
      responses:
        '200':
          $ref: '#/components/responses/ReadyJob'
        '202':
          $ref: '#/components/responses/PendingJob'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /api/observations/epoch-difference:
    get:
      tags: [Observations]
      operationId: prepareEpochDifferenceObservations
      summary: Prepare differences against a selected reference observation
      description: Immediately returns a job for background processing.
      parameters:
        - $ref: '#/components/parameters/RightAscension'
        - $ref: '#/components/parameters/Declination'
        - $ref: '#/components/parameters/Width'
        - $ref: '#/components/parameters/Height'
        - $ref: '#/components/parameters/Detector'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/ObservedAfter'
        - $ref: '#/components/parameters/ObservedBefore'
        - name: reference_frame_id
          in: query
          required: true
          description: Reference frame ID returned by observation search
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          $ref: '#/components/responses/ReadyJob'
        '202':
          $ref: '#/components/responses/PendingJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /api/analyses/motion:
    post:
      tags: [Analyses]
      operationId: submitMotionAnalysis
      summary: Queue real-data moving-source inference with the installed frozen model
      description: |
        Supply an existing download_id or an explicit archived real-data preset.
        Live inputs must provide at least three independent usable observations
        from one detector. Native images remain unchanged; analysis registers a
        separate bounded grid. At most 32 frames and a 512 by 512 grid are supported.
        The learned score prioritizes human review and is not a calibrated
        probability of a real object, a planet, or a new discovery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotionAnalysisRequest'
            example: {preset: comet-d6, options: {mask_policy: motion}}
      responses:
        '202':
          description: Durable analysis accepted; poll status or subscribe to events
          headers:
            Location:
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/AnalysisUnavailable'
  /api/analyses/models:
    get:
      tags: [Analyses]
      operationId: listInferenceModels
      summary: Describe the installed versioned model, checksum and score semantics
      responses:
        '200':
          description: Installed frozen model metadata
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/InferenceModel'
        '503':
          $ref: '#/components/responses/AnalysisUnavailable'
  /api/analyses/presets:
    get:
      tags: [Analyses]
      operationId: listRealAnalysisPresets
      summary: List archived real-observation sequences available for live inference
      description: |
        These selected known-object sequences are recovery/development examples,
        not a representative survey precision benchmark. Detection and model
        inference run on submission; results are not hardcoded target coordinates.
      responses:
        '200':
          description: Available real-data presets
          content:
            application/json:
              schema:
                type: object
                required: [presets]
                properties:
                  presets:
                    type: array
                    items:
                      type: object
                      required: [id, title, description, source_url]
                      properties:
                        id: {type: string}
                        title: {type: string}
                        description: {type: string}
                        source_url: {type: string, format: uri}
        '503':
          $ref: '#/components/responses/AnalysisUnavailable'
  /api/analyses/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Analyses]
      operationId: getMotionAnalysis
      summary: Get durable analysis state, computed candidates and review evidence
      responses:
        '200':
          description: Current analysis; failed tasks include a structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/analyses/{id}/events:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Analyses]
      operationId: watchMotionAnalysis
      summary: Stream analysis progress and terminal state as server-sent events
      description: |
        Sends a current-state snapshot, then analysis.updated and analysis.completed
        events. Event data is an AnalysisJob. A disconnected subscriber does not
        cancel an accepted analysis. Failure is a terminal job with an error.
      responses:
        '200':
          description: Ordered current-state and progress events
          content:
            text/event-stream:
              schema: {type: string}
        '404':
          $ref: '#/components/responses/NotFound'
  /api/analyses/{id}/resources/{name}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: name
        in: path
        required: true
        description: Exact published PNG filename returned in the analysis result
        schema: {type: string}
    get:
      tags: [Analyses]
      operationId: getAnalysisEvidence
      summary: Download an allowlisted image or stack of computed review evidence
      description: |
        Resources are available only after successful analysis publication.
        Images visualize measurements; evidence stacks are not calibrated
        significance maps or a substitute for native FITS scientific analysis.
      responses:
        '200':
          description: Published PNG review resource
          content:
            image/png:
              schema: {type: string, format: binary}
        '404':
          $ref: '#/components/responses/NotFound'
  /api/downloads/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Downloads]
      operationId: getDownload
      summary: Get job progress, resource links, errors, and final result
      description: |
        Returns the current manifest at any stage. A completed manifest is the
        final result. Each chunk includes its observation, status, and URLs.
        Counts include only discovered work; total may grow during discovery.
      responses:
        '200':
          $ref: '#/components/responses/ReadyJob'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/downloads/{id}/events:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Downloads]
      operationId: streamDownloadEvents
      summary: Stream discovery, readiness, failure, and completion events
      description: |
        Server-Sent Events. Each data payload contains job_id and may contain
        chunk_id, resource URLs, progress, or an error. Event names are
        job.updated, chunk.ready, chunk.failed, preview.ready, preview.failed,
        and job.completed. The first job.updated event provides the current
        manifest, including when connecting to an already completed job.
        job.completed is emitted after all requested work reaches a terminal
        state, including failure. Poll GET /api/downloads/{id} after reconnecting
        to recover the complete state. Disconnecting does not cancel the job.
      responses:
        '200':
          description: Event stream; the connection closes after job.completed
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: chunk.ready
                data: {"job_id":"job-123","chunk_id":"chunk-456","fits_cutout_url":"/api/chunks/chunk-456"}

                event: job.completed
                data: {"job_id":"job-123","status":"completed"}

        '404':
          $ref: '#/components/responses/NotFound'
  /api/chunks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Chunks]
      operationId: getChunk
      summary: Download a prepared FITS chunk
      description: |
        A chunk is an internal piece of the requested region for an observation.
        All chunks together cover the requested available data. Metadata must
        explicitly describe missing coverage; a pending resource is not missing.
      responses:
        '200':
          description: Prepared FITS data
          content:
            application/fits:
              schema:
                type: string
                format: binary
        '202':
          $ref: '#/components/responses/PendingResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PreparationFailed'
  /api/chunks/{id}/preview:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Chunks]
      operationId: getChunkPreview
      summary: Get a prepared PNG preview
      description: |
        The preview URL is stable and may be returned before the image exists.
        preview_status or preview.ready determines when it can be displayed.
      responses:
        '200':
          description: Prepared preview image
          content:
            image/png:
              schema:
                type: string
                format: binary
        '202':
          $ref: '#/components/responses/PendingResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PreparationFailed'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    RightAscension:
      name: right_ascension_deg
      in: query
      required: true
      description: ICRS right ascension of the region center, in degrees
      schema: {type: number, minimum: 0, exclusiveMaximum: 360}
    Declination:
      name: declination_deg
      in: query
      required: true
      description: ICRS declination of the region center, in degrees
      schema: {type: number, minimum: -90, maximum: 90}
    Width:
      name: width_arcmin
      in: query
      description: Full angular width in arcminutes, east-west in the local sky plane
      schema: {type: number, exclusiveMinimum: 0, default: 3}
    Height:
      name: height_arcmin
      in: query
      description: Full angular height in arcminutes, north-south in the local sky plane
      schema: {type: number, exclusiveMinimum: 0, default: 3}
    Detector:
      name: detector_array
      in: query
      schema:
        $ref: '#/components/schemas/DetectorSelection'
    Channel:
      name: channel_index
      in: query
      description: Optional spectral channel filter
      schema: {type: integer, minimum: 1, maximum: 102}
    ObservedAfter:
      name: observed_after
      in: query
      description: |
        Lower bound of the observation-time interval, as an ISO 8601 timestamp
        with a timezone. Converted to the lower MJD bound of IRSA TIME.
        Omit for an unbounded start. Must precede observed_before when both are set.
      schema:
        $ref: '#/components/schemas/ObservedAfter'
    ObservedBefore:
      name: observed_before
      in: query
      description: |
        Upper bound of the observation-time interval, as an ISO 8601 timestamp
        with a timezone. Converted to the upper MJD bound of IRSA TIME.
        Omit for an unbounded end. Must follow observed_after when both are set.
      schema:
        $ref: '#/components/schemas/ObservedBefore'
  responses:
    AnalysisUnavailable:
      description: Analysis admission is full or a required installed model/preset is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ReadyJob:
      description: Current job manifest; preparation may still be in progress
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Download'
    PendingJob:
      description: Job accepted; discovery and preparation continue in the background
      headers:
        Location:
          description: URL of GET /api/downloads/{id}
          schema: {type: string, format: uri-reference}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Download'
    PendingResource:
      description: Resource exists in the manifest but is still being prepared
      headers:
        Retry-After:
          description: Suggested delay before retrying, in seconds
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema:
            type: object
            required: [id, status]
            properties:
              id: {type: string}
              status: {type: string, enum: [pending]}
    NotFound:
      description: Unknown job, observation, or chunk
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidRequest:
      description: Invalid coordinates, sizes, filters, or unsupported request size
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ArchiveUnavailable:
      description: Archive search is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreparationFailed:
      description: Resource preparation failed; inspect the job manifest for details
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    ImageUnificationRequest:
      type: object
      additionalProperties: false
      required:
      - inputs
      - grid
      properties:
        inputs:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/ImageUnificationInput'
        grid:
          oneOf:
          - $ref: '#/components/schemas/UnifiedSkyGrid'
          - $ref: '#/components/schemas/UnifiedPixelGrid'
        options:
          $ref: '#/components/schemas/ImageUnificationOptions'
    ImageUnificationInput:
      type: object
      additionalProperties: false
      required:
      - kind
      - id
      properties:
        kind:
          type: string
          enum:
          - archive_asset
          - native_chunk
        id:
          type: string
          minLength: 1
          maxLength: 256
          description: Completed archive asset ID or native chunk ID, never a path or URL
        download_id:
          type: string
          minLength: 1
          maxLength: 256
          description: Required only for native_chunk; its download must use default mode
        image_hdu:
          description: Select a scientific FITS HDU; omission requires an unambiguous image
          oneOf:
          - type: integer
            minimum: 0
            maximum: 1024
          - type: string
            minLength: 1
            maxLength: 68
          - type: 'null'
        plane_indices:
          type: array
          maxItems: 8
          description: Leading cube axes in NumPy order; required for a selected cube
          items:
            type: integer
            minimum: 0
            maximum: 4095
      allOf:
      - if:
          properties:
            kind:
              const: native_chunk
        then:
          required:
          - download_id
        else:
          not:
            required:
            - download_id
    UnifiedSkyGrid:
      type: object
      additionalProperties: false
      required:
      - kind
      - width
      - height
      - ra_degrees
      - dec_degrees
      - pixel_scale_arcsec
      properties:
        kind:
          const: sky
        width:
          type: integer
          minimum: 1
          maximum: 512
        height:
          type: integer
          minimum: 1
          maximum: 512
        ra_degrees:
          type: number
          minimum: 0
          exclusiveMaximum: 360
        dec_degrees:
          type: number
          minimum: -90
          maximum: 90
        pixel_scale_arcsec:
          type: number
          exclusiveMinimum: 0
          maximum: 3600
    UnifiedPixelGrid:
      type: object
      additionalProperties: false
      required:
      - kind
      - width
      - height
      properties:
        kind:
          const: pixel
        width:
          type: integer
          minimum: 1
          maximum: 512
        height:
          type: integer
          minimum: 1
          maximum: 512
    ImageUnificationOptions:
      type: object
      additionalProperties: false
      properties:
        target_unit:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
          description: Optional physically compatible FITS BUNIT conversion; unknown calibration fails
        normalization:
          type: string
          enum:
          - none
          - robust
          default: none
        mask_policy:
          type: string
          enum:
          - science
          - motion
          default: science
          description: Motion additionally retains SPHEREx OUTLIER pixels; other bad flags remain masked
    ImageUnificationJob:
      type: object
      required:
      - id
      - status
      - status_url
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
        status_url:
          type: string
          format: uri-reference
        artifact_url:
          type: string
          format: uri-reference
        error:
          $ref: '#/components/schemas/Error'
    ObservationSelection:
      type: object
      additionalProperties: false
      required:
      - observation_ids
      properties:
        observation_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
          description: Exact stable IDs from observations-search; native source IDs and arbitrary URLs are not
            accepted
        delivery:
          $ref: '#/components/schemas/ArchiveDelivery'
    CommonArchiveObservation:
      allOf:
      - $ref: '#/components/schemas/ArchiveRecord'
      - type: object
        required:
        - frame_id
        - is_available
        properties:
          frame_id:
            type: string
            description: Alias of id; use this server ID in observation_ids. native_id retains the source identity.
          is_available:
            type: boolean
            description: A provider-level delivery candidate; final per-record availability is determined during
              resolution.
          observation_date:
            type: string
            format: date-time
            description: Present only for verified UTC observation time.
          release:
            type: string
          wavelength_min_um:
            type: number
          wavelength_max_um:
            type: number
    ObservationsFound:
      type: object
      required:
      - observations
      - outcomes
      - returned_count
      properties:
        observations:
          type: array
          items:
            $ref: '#/components/schemas/CommonArchiveObservation'
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveProviderOutcome'
        returned_count:
          type: integer
          minimum: 0
    ObservationDownloadChunk:
      type: object
      required:
      - id
      - frame_id
      - status
      - preview_status
      - image_url
      - fits_cutout_url
      properties:
        id:
          type: string
        frame_id:
          type: string
          description: The selected observation ID, matching search id/frame_id.
        status:
          type: string
          enum:
          - pending
          - ready
          - failed
          - unavailable
        preview_status:
          type: string
          enum:
          - unavailable
        image_url:
          type: string
          format: uri-reference
        fits_cutout_url:
          type: string
          format: uri-reference
        error:
          $ref: '#/components/schemas/ArchiveFailure'
    ObservationDownload:
      type: object
      required:
      - id
      - status
      - mode
      - query
      - observations
      - chunks
      - progress
      - status_url
      - events_url
      - errors
      - assets
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - queued
          - preparing
          - completed
          - completed_with_errors
          - failed
        mode:
          type: string
          const: default
        query:
          $ref: '#/components/schemas/ObservationSelection'
        observations:
          type: array
          items:
            $ref: '#/components/schemas/CommonArchiveObservation'
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/ObservationDownloadChunk'
        progress:
          $ref: '#/components/schemas/ArchiveDownloadProgress'
        status_url:
          type: string
          format: uri-reference
        events_url:
          type: string
          format: uri-reference
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveFailure'
        assets:
          type: array
          items:
            type: object
            required:
            - record_id
            - status
            - provenance
            properties:
              record_id:
                type: string
              status:
                type: string
                enum:
                - ready
                - skipped
                - failed
              asset:
                $ref: '#/components/schemas/ArchiveStoredAsset'
              error:
                $ref: '#/components/schemas/ArchiveFailure'
              provenance:
                type: object
                additionalProperties:
                  type: string
    ArchiveCircle:
      type: object
      additionalProperties: false
      required:
      - ra_degrees
      - dec_degrees
      - radius_degrees
      properties:
        type:
          type: string
          const: circle
          default: circle
        ra_degrees:
          type: number
          minimum: 0
          exclusiveMaximum: 360
        dec_degrees:
          type: number
          minimum: -90
          maximum: 90
        radius_degrees:
          type: number
          exclusiveMinimum: 0
          maximum: 180
    ArchiveProductKind:
      type: string
      enum:
      - image
      - cube
      - spectrum
      - catalog_source
      - coverage
    ArchiveCompleteness:
      type: string
      enum:
      - complete
      - truncated
      - unknown
      - indexed_subset
    ArchiveQuery:
      type: object
      additionalProperties: false
      required:
      - region
      - providers
      properties:
        region:
          $ref: '#/components/schemas/ArchiveCircle'
        providers:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        product_kinds:
          type: array
          minItems: 1
          default:
          - image
          items:
            $ref: '#/components/schemas/ArchiveProductKind'
        time_start_utc:
          type:
          - string
          - 'null'
          format: date-time
        time_end_utc:
          type:
          - string
          - 'null'
          format: date-time
        limit_per_provider:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
    ArchiveInventory:
      type: object
      required:
      - id
      - capabilities
      properties:
        id:
          type: string
        capabilities:
          type: object
          properties:
            product_kinds:
              type: array
              items:
                $ref: '#/components/schemas/ArchiveProductKind'
            time_filter:
              type: string
              enum:
              - exact_utc
              - native
              - client
              - provisional
              - unsupported
            original:
              type: boolean
            cutout:
              type: boolean
            availability:
              type: string
              enum:
              - available
              - unavailable
              - requires_auth
              - pending_qualification
            restrictions:
              type: array
              items:
                type: string
            geometry:
              type: string
    ArchiveAcceptedJob:
      type: object
      required:
      - id
      - status_url
      properties:
        id:
          type: string
        status_url:
          type: string
          format: uri-reference
        events_url:
          type: string
          format: uri-reference
          description: Present for download jobs; omitted for metadata search jobs
    ArchiveFailure:
      type: object
      required:
      - code
      - message
      - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        retry_after_seconds:
          type: integer
          minimum: 0
    ArchiveProviderOutcome:
      type: object
      required:
      - provider
      - status
      - record_count
      - completeness
      - warnings
      - has_continuation
      properties:
        provider:
          type: string
        status:
          type: string
          enum:
          - success
          - empty
          - unavailable
          - requires_auth
          - unsupported_filter
          - failed
        record_count:
          type: integer
          minimum: 0
        completeness:
          $ref: '#/components/schemas/ArchiveCompleteness'
        warnings:
          type: array
          items:
            type: string
        error:
          $ref: '#/components/schemas/ArchiveFailure'
        has_continuation:
          type: boolean
    ArchiveObservationTime:
      type: object
      properties:
        start_utc:
          type: string
          format: date-time
        end_utc:
          type: string
          format: date-time
        quality:
          type: string
          enum:
          - verified
          - native
          - provisional
          - reference_epoch
          - unknown
        native:
          type: object
          additionalProperties:
            type: string
        reference_epoch:
          type: string
    ArchiveRecord:
      type: object
      required:
      - id
      - provider
      - collection
      - native_id
      - product_kind
      - time
      - native
      - provenance
      - original
      - cutout
      - analysisEligible
      properties:
        id:
          type: string
        provider:
          type: string
        collection:
          type: string
        native_id:
          type: string
          description: Native string identity; catalogue IDs never pass through floating
            point
        product_kind:
          $ref: '#/components/schemas/ArchiveProductKind'
        version:
          type: string
        mission:
          type: string
        instrument:
          type: string
        sky_coverage:
          type: string
        time:
          $ref: '#/components/schemas/ArchiveObservationTime'
        wavelength_min_m:
          type: number
        wavelength_max_m:
          type: number
        brightness_unit:
          type: string
          description: Omitted when BUNIT or equivalent units are unknown
        native:
          type: object
          additionalProperties:
            type: string
        provenance:
          type: object
          additionalProperties:
            type: string
        original:
          type: boolean
          description: Provider-level original-delivery candidate; individual asset availability
            and authorization are qualified at resolution
        cutout:
          type: boolean
          description: Provider-level cutout candidate; DataLink must advertise a usable
            per-record SODA service at resolution
        analysisEligible:
          type: boolean
          const: false
    ArchiveSearchPage:
      type: object
      required:
      - id
      - status
      - outcomes
      - records
      - returned_count
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - partial
          - failed
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveProviderOutcome'
        records:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveRecord'
        returned_count:
          type: integer
          minimum: 0
          maximum: 200
        next_cursor:
          type: string
    ArchiveDelivery:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
          - prefer_cutout
          - require_cutout
          - original
          default: prefer_cutout
        region:
          $ref: '#/components/schemas/ArchiveCircle'
    ArchiveStoredAsset:
      type: object
      required:
      - id
      - bytes
      - sha256
      - compression
      - analysisEligible
      - artifact_url
      properties:
        id:
          type: string
        bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
        compression:
          type: string
          enum:
          - native
          - gzip
        brightness_unit:
          type: string
        analysisEligible:
          type: boolean
          const: false
        artifact_url:
          type: string
          format: uri-reference
    ArchiveDownload:
      type: object
      required:
      - id
      - status
      - selection
      - assets
      - status_url
      - events_url
      - chunks
      - progress
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - partial
          - failed
        selection:
          type: object
          properties:
            record_ids:
              type: array
              items:
                type: string
            delivery:
              $ref: '#/components/schemas/ArchiveDelivery'
        assets:
          type: array
          items:
            type: object
            required:
            - record_id
            - status
            - provenance
            properties:
              record_id:
                type: string
              status:
                type: string
                enum:
                - ready
                - skipped
                - failed
              asset:
                $ref: '#/components/schemas/ArchiveStoredAsset'
              error:
                $ref: '#/components/schemas/ArchiveFailure'
              provenance:
                type: object
                additionalProperties:
                  type: string
        status_url:
          type: string
          format: uri-reference
        events_url:
          type: string
          format: uri-reference
        chunks:
          type: array
          description: Stable native-product links are advertised before files are ready
          items:
            $ref: '#/components/schemas/ArchiveDownloadChunk'
        progress:
          $ref: '#/components/schemas/ArchiveDownloadProgress'
    ArchiveDownloadProgress:
      type: object
      required: [discovery_complete, total_chunks, ready_chunks, failed_chunks, unavailable_chunks]
      properties:
        discovery_complete: {type: boolean}
        total_chunks: {type: integer, minimum: 0}
        ready_chunks: {type: integer, minimum: 0}
        failed_chunks: {type: integer, minimum: 0}
        unavailable_chunks: {type: integer, minimum: 0}
    ArchiveDownloadChunk:
      type: object
      required: [id, record_id, artifact_url, status]
      properties:
        id: {type: string}
        record_id: {type: string}
        artifact_url: {type: string, format: uri-reference}
        status:
          type: string
          enum: [pending, downloading, ready, skipped, failed]
        error:
          $ref: '#/components/schemas/ArchiveFailure'
    PipelineSpectrum:
      type: object
      description: Original team-service response; no 102-band completeness or calibrated-science guarantee is added.
      required: [target, ra, dec, aperture_radius_pix, subtraction_mode, total_channels, spectrum]
      properties:
        target: {type: string}
        ra: {type: number}
        dec: {type: number}
        candidate_id: {type: [string, 'null']}
        aperture_radius_pix: {type: number}
        subtraction_mode: {type: string, enum: [zodi_subtracted]}
        total_channels: {type: integer, minimum: 0}
        spectrum:
          type: array
          items:
            type: object
            properties:
              channel: {type: integer}
              detector: {type: string}
              detector_array: {type: integer}
              wavelength_um: {type: number}
              bandwidth_um: {type: number}
              flux_mjy: {type: number}
              uncertainty_mjy: {type: number}
              snr: {type: number}
              flagged: {type: boolean}
        molecular_detections: {type: array, items: {type: object}}
        detectors_summary: {type: object, additionalProperties: true}
      additionalProperties: true
    ObservationMetadata:
      type: object
      required: [frame_id, status, observation, sia, tap, fits]
      properties:
        frame_id: {type: string}
        status: {type: string, enum: [complete, partial], description: Aggregate availability of the requested metadata sources}
        observation:
          $ref: '#/components/schemas/Observation'
        sia:
          $ref: '#/components/schemas/MetadataSource'
        tap:
          $ref: '#/components/schemas/MetadataSource'
        fits:
          $ref: '#/components/schemas/MetadataSource'
    MetadataSource:
      type: object
      required: [status]
      description: Source-specific metadata with availability, values, field definitions, HDU headers or an explicit error
      properties:
        status: {type: string, enum: [available, unavailable, not_found, not_downloaded, error, stale]}
        reason: {type: string}
        data:
          type: object
          additionalProperties: true
        fields:
          type: array
          items:
            type: object
            description: Original TAP field name, datatype, unit, description and available VO annotations
            additionalProperties: true
        rows:
          type: array
          items:
            type: object
            description: Typed TAP row; missing values are null
            additionalProperties: true
        hdus:
          type: array
          items:
            $ref: '#/components/schemas/FitsHdu'
        error:
          $ref: '#/components/schemas/Error'
      additionalProperties: true
    FitsHdu:
      type: object
      required: [index, type, bitpix, axes, cards]
      properties:
        index: {type: integer, minimum: 0}
        name: {type: [string, 'null']}
        type: {type: string}
        bitpix: {type: integer}
        axes:
          type: array
          items: {type: integer, minimum: 0}
        header_offset_bytes: {type: integer, minimum: 0}
        data_offset_bytes: {type: integer, minimum: 0}
        data_size_bytes: {type: integer, minimum: 0}
        cards:
          type: array
          description: Physical header cards in original order, including repeated COMMENT and HISTORY cards
          items:
            type: object
            required: [raw]
            properties:
              key: {type: [string, 'null']}
              value: {}
              comment: {type: [string, 'null']}
              raw: {type: string}
    EquipmentCatalogue:
      type: object
      required: [facility, instrument, release, detectors, calibration_products, catalogue_source, catalogue_complete]
      properties:
        facility: {type: string}
        instrument: {type: string}
        release: {type: string, enum: [DR1, QR3]}
        detectors:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentDetector'
        calibration_products:
          type: array
          items:
            $ref: '#/components/schemas/CalibrationProduct'
        catalogue_source: {type: string, format: uri}
        catalogue_complete: {type: boolean}
        catalogue_ttl_seconds: {type: integer, minimum: 0}
        catalogue_scope: {type: string}
        not_listed_product_types:
          type: array
          items: {type: string}
        frame_applicability: {type: string}
    EquipmentDetector:
      type: object
      required: [detector_array, wavelength_min_um, wavelength_max_um, resolving_power]
      properties:
        detector_array: {type: integer, minimum: 1, maximum: 6}
        wavelength_min_um: {type: number}
        wavelength_max_um: {type: number}
        resolving_power: {type: integer}
    CalibrationProduct:
      type: object
      required: [id, product_type, version, release, source_url, download_url, file_name, size_bytes, detector_relevance]
      properties:
        id: {type: string}
        product_type: {type: string}
        version: {type: string}
        detector_array: {type: [integer, 'null'], minimum: 1, maximum: 6}
        release: {type: string, enum: [DR1, QR3]}
        source_url: {type: string, format: uri}
        download_url: {type: string, format: uri-reference}
        file_name: {type: string}
        size_bytes: {type: integer, minimum: 1}
        detector_relevance: {type: string, enum: [single_detector, all_detectors]}
    MotionAnalysisRequest:
      type: object
      additionalProperties: false
      oneOf:
        - required: [download_id]
          not: {required: [preset]}
        - required: [preset]
          not: {required: [download_id]}
      properties:
        download_id:
          type: string
          minLength: 1
          maxLength: 128
          description: ID returned by a native default-mode observations preparation endpoint. Processed downloads are rejected to avoid applying zodiacal subtraction twice.
        preset:
          type: string
          enum: [comet-d6, comet-d2, vesta-d6, vesta-d3]
        options:
          $ref: '#/components/schemas/AnalysisOptions'
    AnalysisOptions:
      type: object
      additionalProperties: false
      properties:
        min_snr: {type: number, exclusiveMinimum: 0, maximum: 100, default: 4}
        min_speed_arcsec_per_hour: {type: number, exclusiveMinimum: 0, default: 3.075}
        max_speed_arcsec_per_hour: {type: number, exclusiveMinimum: 0, maximum: 100000, default: 369}
        mask_policy:
          type: string
          enum: [motion, science]
          default: motion
          description: |
            Motion retains OUTLIER pixels as explicitly flagged evidence.
            Science excludes them. Saturated BLOOM tracks are a separate
            non-photometric evidence stream and have no learned score.
        max_candidates: {type: integer, minimum: 1, maximum: 100, default: 100}
        max_peaks: {type: integer, minimum: 1, maximum: 100, default: 100}
        pixel_scale_arcsec: {type: number, minimum: 0.1, maximum: 60, default: 6.15}
        min_epochs: {type: integer, minimum: 3, maximum: 32, default: 3}
      description: Maximum speed must not be less than minimum speed. Caps are reported as incomplete-search warnings.
    InferenceModel:
      type: object
      required: [model_id, sha256, feature_names, score_kind]
      properties:
        model_id: {type: string}
        release_name: {type: string, description: Optional human-readable experimental release name; model_id and sha256 remain the artifact identity.}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        feature_names: {type: array, items: {type: string}}
        score_kind: {type: string}
        status: {type: string}
        score_description: {type: string}
        training_manifest_sha256: {type: string}
        model_family: {type: string, enum: [RandomForestClassifier, ExtraTreesClassifier, HistGradientBoostingClassifier, RankNetTreeBoost, ListNetTreeBoost], description: Ranking model family. score_kind defines the uncalibrated score semantics.}
        detector_profile:
          type: object
          description: Artifact-bound training detector defaults; request thresholds and speed options remain configurable.
          properties:
            psf_sigma: {type: number, enum: [0.8, 1.2]}
          additionalProperties: true
        algorithm_version_proposal: {type: string, description: Artifact-bound scientific algorithm identifier. Application versions remain Git revisions.}
      additionalProperties: true
    AnalysisJob:
      type: object
      required: [id, status, status_url, events_url]
      properties:
        id: {type: string}
        status:
          type: string
          enum: [queued, waiting_for_download, preparing, inferencing, completed, failed]
        download_id: {type: [string, 'null']}
        status_url: {type: string, format: uri-reference}
        events_url: {type: string, format: uri-reference}
        result:
          oneOf:
            - $ref: '#/components/schemas/AnalysisResult'
            - {type: 'null'}
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
            - {type: 'null'}
    AnalysisResult:
      type: object
      required: [schema_version, analysis_id, model, frames, candidates, settings, warnings, provenance, resources]
      properties:
        schema_version: {type: integer, const: 1}
        analysis_id: {type: string}
        model:
          $ref: '#/components/schemas/InferenceModel'
        frames:
          type: array
          minItems: 3
          maxItems: 32
          items:
            type: object
            required: [frame_id, observation_id, midpoint_utc, width, height, image_url, difference_url]
            properties:
              frame_id: {type: string}
              observation_id: {type: string}
              midpoint_utc: {type: string, format: date-time}
              width: {type: integer, minimum: 1, maximum: 512}
              height: {type: integer, minimum: 1, maximum: 512}
              image_url: {type: string, format: uri-reference}
              difference_url: {type: string, format: uri-reference}
              bloom_url: {type: string, format: uri-reference}
            additionalProperties: true
        candidates:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MotionCandidate'
        settings: {type: object, additionalProperties: true}
        warnings: {type: array, items: {type: string}}
        provenance: {type: object, additionalProperties: true}
        resources:
          type: array
          items:
            type: object
            required: [name, media_type, size_bytes]
            properties:
              name: {type: string}
              media_type: {type: string, const: image/png}
              size_bytes: {type: integer, minimum: 1}
      additionalProperties: true
    MotionCandidate:
      type: object
      required: [id, rank, method, score, score_kind, baseline_rank, right_ascension_deg, declination_deg, speed_arcsec_per_hour, fit_rms_px, detections, warnings]
      properties:
        id: {type: string}
        rank: {type: integer, minimum: 1}
        method: {type: string, enum: [residual_track, bloom_track]}
        score:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Experimental model ranking score; null for non-ML saturated-source evidence
        score_kind: {type: string}
        baseline_rank: {type: integer, minimum: 1}
        baseline_score: {type: [number, 'null']}
        right_ascension_deg: {type: number, minimum: 0, exclusiveMaximum: 360}
        declination_deg: {type: number, minimum: -90, maximum: 90}
        coordinate_epoch_utc: {type: string, format: date-time}
        speed_arcsec_per_hour: {type: number, minimum: 0}
        fit_rms_px: {type: number, minimum: 0}
        detections:
          type: array
          minItems: 3
          items:
            type: object
            required: [frame_index, frame_id, midpoint_utc, x, y, right_ascension_deg, declination_deg, residual_snr, warnings]
            properties:
              frame_index: {type: integer, minimum: 0, maximum: 31}
              frame_id: {type: string}
              midpoint_utc: {type: string, format: date-time}
              x: {type: number, minimum: 0}
              y: {type: number, minimum: 0}
              right_ascension_deg: {type: number, minimum: 0, exclusiveMaximum: 360}
              declination_deg: {type: number, minimum: -90, maximum: 90}
              residual_snr: {type: [number, 'null']}
              warnings: {type: array, items: {type: string}}
            additionalProperties: true
        warnings: {type: array, items: {type: string}}
        moving_stack_url: {type: string, format: uri-reference}
        stationary_stack_url: {type: string, format: uri-reference}
      additionalProperties: true
    ObservedAfter:
      type: string
      format: date-time
      description: Observation-time lower bound; converted to MJD for IRSA TIME. Omit for an unbounded start.
      example: '2025-04-29T00:00:00Z'
    ObservedBefore:
      type: string
      format: date-time
      description: Observation-time upper bound; converted to MJD for IRSA TIME. Must follow observed_after. Omit for an unbounded end.
      example: '2025-04-30T00:00:00Z'
    DetectorSelection:
      default: all
      oneOf:
        - {type: integer, minimum: 1, maximum: 6}
        - {type: string, enum: [all]}
    SkyQuery:
      type: object
      required: [right_ascension_deg, declination_deg]
      properties:
        survey:
          type: string
          enum: [wide, deep]
          default: wide
          description: Survey selection; deep preparation always selects deep
        right_ascension_deg: {type: number, minimum: 0, exclusiveMaximum: 360}
        declination_deg: {type: number, minimum: -90, maximum: 90}
        width_arcmin: {type: number, exclusiveMinimum: 0, default: 3}
        height_arcmin: {type: number, exclusiveMinimum: 0, default: 3}
        detector_array:
          $ref: '#/components/schemas/DetectorSelection'
        channel_index: {type: integer, minimum: 1, maximum: 102}
        observed_after:
          $ref: '#/components/schemas/ObservedAfter'
        observed_before:
          $ref: '#/components/schemas/ObservedBefore'
    RangeQuery:
      type: object
      required:
        - right_ascension_min_deg
        - right_ascension_max_deg
        - declination_min_deg
        - declination_max_deg
      properties:
        survey:
          type: string
          enum: [wide, deep]
          default: wide
          description: Survey selection; deep preparation always selects deep
        right_ascension_min_deg: {type: number, minimum: 0, maximum: 360}
        right_ascension_max_deg: {type: number, minimum: 0, maximum: 360}
        declination_min_deg: {type: number, minimum: -90, maximum: 90}
        declination_max_deg: {type: number, minimum: -90, maximum: 90}
        detector_array:
          $ref: '#/components/schemas/DetectorSelection'
        channel_index: {type: integer, minimum: 1, maximum: 102}
        observed_after:
          $ref: '#/components/schemas/ObservedAfter'
        observed_before:
          $ref: '#/components/schemas/ObservedBefore'
    PolygonCoordinates:
      type: array
      minItems: 6
      items: {type: number}
      description: |
        Flat ICRS coordinate pairs in degrees: ra1,dec1,ra2,dec2,ra3,dec3,...
        Requires an even number of coordinates and a valid convex spherical polygon.
        RA/Dec ranges and geometry require backend validation.
    PolygonQuery:
      type: object
      required: [verices_degrees]
      properties:
        survey:
          type: string
          enum: [wide, deep]
          default: wide
          description: Survey selection; deep preparation always selects deep
        verices_degrees:
          $ref: '#/components/schemas/PolygonCoordinates'
        detector_array:
          $ref: '#/components/schemas/DetectorSelection'
        channel_index: {type: integer, minimum: 1, maximum: 102}
        observed_after:
          $ref: '#/components/schemas/ObservedAfter'
        observed_before:
          $ref: '#/components/schemas/ObservedBefore'
    Observation:
      type: object
      required: [frame_id, observation_date, detector_array, release, is_available]
      properties:
        frame_id: {type: string}
        observation_date: {type: string, format: date-time}
        detector_array: {type: integer, minimum: 1, maximum: 6}
        release: {type: string, enum: [DR1, QR3]}
        wavelength_min_um: {type: number}
        wavelength_max_um: {type: number}
        channel_index: {type: integer, minimum: 1, maximum: 102}
        is_available: {type: boolean}
        skip_reason: {type: string}
        header_metadata:
          type: object
          description: Available archive metadata; unavailable metrics are omitted
          additionalProperties: true
    Chunk:
      type: object
      required: [id, frame_id, status, preview_status, image_url, fits_cutout_url]
      properties:
        id: {type: string}
        frame_id: {type: string}
        status: {type: string, enum: [pending, ready, failed, unavailable]}
        preview_status: {type: string, enum: [pending, ready, failed, unavailable]}
        image_url: {type: string, format: uri-reference}
        fits_cutout_url: {type: string, format: uri-reference}
        region:
          $ref: '#/components/schemas/SkyQuery'
        error:
          $ref: '#/components/schemas/Error'
    Download:
      type: object
      required: [id, status, mode, query, observations, chunks, progress, status_url, events_url]
      properties:
        id: {type: string}
        status:
          type: string
          enum: [queued, discovering, preparing, completed, completed_with_errors, failed]
        mode:
          type: string
          enum: [default, zodi_reference_subtracted, epoch_difference]
        query:
          description: Original request geometry and filters for this download job
          oneOf:
            - $ref: '#/components/schemas/SkyQuery'
            - $ref: '#/components/schemas/RangeQuery'
            - $ref: '#/components/schemas/PolygonQuery'
        reference_frame_id: {type: string}
        observations:
          type: array
          description: May be empty while archive discovery is in progress
          items:
            $ref: '#/components/schemas/Observation'
        chunks:
          type: array
          description: Discovered chunks; new entries may arrive during discovery
          items:
            $ref: '#/components/schemas/Chunk'
        progress:
          type: object
          required: [discovery_complete, total_chunks, ready_chunks, failed_chunks, unavailable_chunks]
          properties:
            discovery_complete: {type: boolean}
            total_chunks: {type: integer, minimum: 0}
            ready_chunks: {type: integer, minimum: 0}
            failed_chunks: {type: integer, minimum: 0}
            unavailable_chunks: {type: integer, minimum: 0}
        status_url: {type: string, format: uri-reference}
        events_url: {type: string, format: uri-reference}
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        retryable: {type: boolean}
