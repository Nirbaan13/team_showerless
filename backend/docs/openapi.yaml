# AI-generated OpenAPI specification.
openapi: 3.1.0
info:
  title: SPHEREx Backend API
  version: 0.1.0
  description: |
    Proposed backend contract. Search is independent from data preparation.
    The observation endpoints replace POST /api/downloads and select the
    processing mode through the URL. Download status, events, chunk data,
    and preview endpoints are retained.
    URLs may be returned before their resources are ready. Clients must use
    resource status or readiness events before fetching image or FITS data.
    Optional observed_after and observed_before timestamps constrain observation
    time for every query geometry. The backend converts them to Modified Julian
    Dates (MJD) and sends IRSA TIME=<start_mjd> <end_mjd>. An omitted bound becomes
    -Inf or +Inf; when both bounds are omitted, no TIME filter is sent.
    Preparing observations retrieves server-side IRSA spatial cutouts of the
    selected Spectral Image MEFs. The returned FITS retains mission extensions
    and its native pixel orientation. An enclosing cutout covers the requested
    region without reprojection or exact polygon masking; it can be clipped at
    the parent image boundary. Failed cutouts never trigger a full-image fallback.
servers:
  - url: http://144.124.238.101
tags:
  - name: Observations
  - name: Downloads
  - name: Chunks
  - name: Equipment
  - name: Analyses
paths:
  /api/spectrum:
    get:
      tags: [Spectra]
      operationId: measureSpectrumPreview
      summary: Measure experimental aperture points from native SPHEREx observations
      description: >-
        Scala owns IRSA discovery and durable native downloads. Returns 202 while
        downloading; retry with the returned download_id and the same coordinates
        and aperture. Python runs the team's measured WCS-WAVE aperture function.
        WCS-WAVE is intended for visualization: these points are approximate,
        uncorrected aperture fluxes, not scientifically calibrated spectra. Each
        channel is a measurement index, not a physical SPHEREx channel ID. Missing
        wavelengths and failed or masked exposures are never synthesized. No
        molecular detections, aperture corrections or complete 102-band coverage
        are claimed. Reuses only default-mode native downloads.
      parameters:
        - {name: ra, in: query, required: true, schema: {type: number, minimum: 0, exclusiveMaximum: 360}, description: Right ascension in ICRS degrees}
        - {name: dec, in: query, required: true, schema: {type: number, minimum: -90, maximum: 90}, description: Declination in ICRS degrees}
        - {name: radius_pix, in: query, schema: {type: number, minimum: 0.5, maximum: 10, default: 2}, description: Circular aperture radius in native image pixels}
        - {name: subtraction, in: query, schema: {type: string, enum: [raw_calibrated, zodi_subtracted], default: zodi_subtracted}}
        - {name: size_arcmin, in: query, schema: {type: number, minimum: 0.5, maximum: 10, default: 1.5}, description: Requested cutout width and height before measurement}
        - {name: max_frames, in: query, schema: {type: integer, minimum: 1, maximum: 120, default: 120}, description: Measurement limit after bounded archive retrieval; not a download limit}
        - {name: candidate_id, in: query, schema: {type: string, maxLength: 256}, description: Display label only; never a detection or catalog match}
        - {name: download_id, in: query, schema: {type: string, maxLength: 128}, description: Existing native download ID; repeat this ID when polling a 202 response}
        - {name: detector_array, in: query, schema: {type: string, enum: ['all', '1', '2', '3', '4', '5', '6']}}
        - {name: observed_after, in: query, schema: {type: string, format: date-time}}
        - {name: observed_before, in: query, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Actual diagnostic aperture measurements, possibly incomplete
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SpectrumPreview'}
        '202':
          description: Durable native download is still discovering or preparing
          headers:
            Retry-After: {schema: {type: integer}, description: Suggested polling delay in seconds}
            Location: {schema: {type: string}, description: Spectrum polling URL}
          content:
            application/json:
              schema:
                type: object
                required: [id, download_id, status, status_url, download_status_url]
                properties:
                  id: {type: string}
                  download_id: {type: string}
                  status: {type: string}
                  status_url: {type: string, format: uri-reference}
                  download_status_url: {type: string, format: uri-reference}
        '404': {description: Unknown download or no usable aperture measurements}
        '422': {description: Invalid coordinates, options, duplicate parameters or processed input}
        '500': {description: Worker output failed validation}
        '503': {description: Archive, cache or worker unavailable}
        '504': {description: Processing exceeded its time budget}
  /api/observations/meta:
    get:
      tags: [Observations]
      operationId: getObservationMetadata
      summary: Get expanded metadata for a previously discovered frame
      description: |
        Supply frame_id returned by search or a download job. Combines available
        SIA metadata, additional TAP fields and FITS HDU headers. FITS headers are
        read only when the FITS is already cached; this request never
        downloads a science image. Each source reports its own availability or
        error. Partial metadata remains useful when an external source fails.
        Cached cutout headers are labelled fits.spatial_subset=true; SIA and TAP
        metadata continue to describe the parent spectral image.
      parameters:
        - name: frame_id
          in: query
          required: true
          description: Frame identifier returned by observation search
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Available metadata with explicit source status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationMetadata'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /api/equipment:
    get:
      tags: [Equipment]
      operationId: getEquipment
      summary: Get SPHEREx equipment and available calibration products
      description: |
        Discovers actual calibration files in the official IRSA public archive
        mirror. Results are cached by release and detector. Calibration versions
        are listed explicitly; a catalogue entry does not imply applicability to
        every frame. Files are fetched through the calibration resource endpoint.
      parameters:
        - name: release
          in: query
          schema: {type: string, enum: [DR1, QR3], default: DR1}
        - $ref: '#/components/parameters/Detector'
      responses:
        '200':
          description: Equipment details and discovered calibration catalogue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentCatalogue'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ArchiveUnavailable'
  /api/equipment/calibrations/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Equipment]
      operationId: getCalibrationFile
      summary: Download a calibration file through the backend cache
      description: |
        Supply a calibration file ID returned by equipment. The backend resolves
        its persisted archive identity, downloads the original file when needed
        and serves the cached bytes. Arbitrary archive URLs are not accepted.
      responses:
        '200':
          description: Original calibration file bytes (FITS, YAML, ECSV or another listed format)
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ArchiveUnavailable'
  /api/observationsDeep:
    get:
      tags: [Observations]
      operationId: prepareDeepObservations
      summary: Prepare native observations from the SPHEREx deep surveys
      description: |
        Queries spherex_dr1_deep and spherex_qr3_deep. Supply exactly one complete
        geometry: center RA/Dec with optional width/height, four range boundaries,
        or verices_degrees polygon coordinates. Geometry families cannot be mixed.
        Dates, detector and channel use the same filters as other preparation
        endpoints. Returns the existing asynchronous download job, SSE events and
        chunk URLs. Query survey is deep; each chunk is one IRSA spatial cutout
        from a matching parent spectral image, within its native boundaries.
      parameters:
        - name: right_ascension_deg
          in: query
          schema: {type: number, minimum: 0, exclusiveMaximum: 360}
        - name: declination_deg
          in: query
          schema: {type: number, minimum: -90, maximum: 90}
        - name: width_arcmin
          in: query
          description: Center geometry only; defaults to3 when omitted
          schema: {type: number, exclusiveMinimum: 0}
        - name: height_arcmin
          in: query
          description: Center geometry only; defaults to3 when omitted
          schema: {type: number, exclusiveMinimum: 0}
        - name: right_ascension_min_deg
          in: query
          schema: {type: number, minimum: 0, maximum: 360}
        - name: right_ascension_max_deg
          in: query
          schema: {type: number, minimum: 0, maximum: 360}
        - name: declination_min_deg
          in: query
          schema: {type: number, minimum: -90, maximum: 90}
        - name: declination_max_deg
          in: query
          schema: {type: number, minimum: -90, maximum: 90}
        - name: verices_degrees
          in: query
          style: form
          explode: false
          schema:
            $ref: '#/components/schemas/PolygonCoordinates'
        - $ref: '#/components/parameters/Detector'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/ObservedAfter'
        - $ref: '#/components/parameters/ObservedBefore'
      responses:
        '200':
          $ref: '#/components/responses/ReadyJob'
        '202':
          $ref: '#/components/responses/PendingJob'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ArchiveUnavailable'
  /api/observations/search:
    post:
      tags: [Observations]
      operationId: searchObservations
      summary: Search archive observations without downloading image data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkyQuery'
      responses:
        '200':
          description: Matching observation metadata
          content:
            application/json:
              schema:
                type: object
                required: [observations]
                properties:
                  observations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Observation'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/ArchiveUnavailable'
  # overenginering: keep the legacy center/width/height endpoint for compatibility.
  /api/observations/default:
    get:
      tags: [Observations]
      operationId: prepareDefaultObservations
      summary: Prepare calibrated observations without additional subtraction
      description: |
        Immediately returns a download job and stable future resource URLs.
        Discovery and preparation run in the background. Repeated identical
        requests reuse the existing active job or cached result.
      parameters:
        - $ref: '#/components/parameters/RightAscension'
        - $ref: '#/components/parameters/Declination'
        - $ref: '#/components/parameters/Width'
        - $ref: '#/components/parameters/Height'
        - $ref: '#/components/parameters/Detector'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/ObservedAfter'
        - $ref: '#/components/parameters/ObservedBefore'
      responses:
        '200':
          $ref: '#/components/responses/ReadyJob'
        '202':
          $ref: '#/components/responses/PendingJob'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /api/observations/range:
    get:
      tags: [Observations]
      operationId: prepareRangeObservations
      summary: Prepare observations intersecting a rectangular sky region
      description: |
        Uses the same default preparation, download job, chunk statuses, cache,
        and resource URLs as observations/default, without a center or dimensions.
        Discovery and preparation run in the background. Repeated identical
        requests reuse the existing active job or cached result.
        The backend constructs the IRSA query as
        POS=RANGE ra_min ra_max dec_min dec_max.
        All coordinates are ICRS degrees. Native IRSA image boundaries are retained;
        the service does not introduce its own tile grid.
      parameters:
        - name: right_ascension_min_deg
          in: query
          required: true
          description: Lower right ascension boundary, in ICRS degrees
          schema: {type: number, minimum: 0, maximum: 360}
          example: 210.80
        - name: right_ascension_max_deg
          in: query
          required: true
          description: Upper right ascension boundary, in ICRS degrees
          schema: {type: number, minimum: 0, maximum: 360}
          example: 210.81
        - name: declination_min_deg
          in: query
          required: true
          description: Lower declination boundary, in ICRS degrees
          schema: {type: number, minimum: -90, maximum: 90}
          example: 54.34
        - name: declination_max_deg
          in: query
          required: true
          description: Upper declination boundary, in ICRS degrees
          schema: {type: number, minimum: -90, maximum: 90}
          example: 54.35
        - $ref: '#/components/parameters/Detector'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/ObservedAfter'
        - $ref: '#/components/parameters/ObservedBefore'
      responses:
        '200':
          $ref: '#/components/responses/ReadyJob'
        '202':
          $ref: '#/components/responses/PendingJob'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /api/observations/polygon:
    get:
      tags: [Observations]
      operationId: preparePolygonObservations
      summary: Prepare observations intersecting a sky polygon
      description: |
        Uses the same default preparation, download job, chunk statuses, cache,
        and resource URLs as observations/default, without a center or dimensions.
        Discovery and preparation run in the background. Repeated identical
        requests reuse the existing active job or cached result.
        The backend constructs POS=POLYGON from the supplied coordinate pairs.
        All coordinates are ICRS degrees. Native IRSA image boundaries are retained;
        the service does not introduce its own tile grid.
      parameters:
        - name: verices_degrees
          in: query
          required: true
          description: |
            Comma-separated coordinates in the order ra1,dec1,ra2,dec2,ra3,dec3,...
            Supply at least three vertices in boundary order for a convex spherical
            polygon. The number of coordinates must be even. Each right ascension
            must be between 0 and 360 degrees; each declination must be between
            -90 and 90 degrees. Coordinate pairing and polygon validity are checked
            by the backend in addition to schema validation.
          style: form
          explode: false
          schema:
            $ref: '#/components/schemas/PolygonCoordinates'
          example: [210.80, 54.34, 210.81, 54.34, 210.81, 54.35, 210.80, 54.35]
        - $ref: '#/components/parameters/Detector'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/ObservedAfter'
        - $ref: '#/components/parameters/ObservedBefore'
      responses:
        '200':
          $ref: '#/components/responses/ReadyJob'
        '202':
          $ref: '#/components/responses/PendingJob'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /api/observations/zodi-reference-subtracted:
    get:
      tags: [Observations]
      operationId: prepareZodiSubtractedObservations
      summary: Subtract the observation's native zodiacal-background model
      description: |
        Subtracts the observation's own ZODI layer from its calibrated IMAGE on
        the original pixel grid, masks the validated bad-pixel bits, and preserves
        ancillary FITS HDUs, WCS and source provenance. This mode does not subtract
        a separate observation or reproject images. Immediately returns a job;
        processed FITS and real PNG previews become ready in the background.
      parameters:
        - $ref: '#/components/parameters/RightAscension'
        - $ref: '#/components/parameters/Declination'
        - $ref: '#/components/parameters/Width'
        - $ref: '#/components/parameters/Height'
        - $ref: '#/components/parameters/Detector'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/ObservedAfter'
        - $ref: '#/components/parameters/ObservedBefore'
      responses:
        '200':
          $ref: '#/components/responses/ReadyJob'
        '202':
          $ref: '#/components/responses/PendingJob'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /api/observations/epoch-difference:
    get:
      tags: [Observations]
      operationId: prepareEpochDifferenceObservations
      summary: Prepare differences against a selected reference observation
      description: Immediately returns a job for background processing.
      parameters:
        - $ref: '#/components/parameters/RightAscension'
        - $ref: '#/components/parameters/Declination'
        - $ref: '#/components/parameters/Width'
        - $ref: '#/components/parameters/Height'
        - $ref: '#/components/parameters/Detector'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/ObservedAfter'
        - $ref: '#/components/parameters/ObservedBefore'
        - name: reference_frame_id
          in: query
          required: true
          description: Reference frame ID returned by observation search
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          $ref: '#/components/responses/ReadyJob'
        '202':
          $ref: '#/components/responses/PendingJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
  /api/analyses/motion:
    post:
      tags: [Analyses]
      operationId: submitMotionAnalysis
      summary: Queue real-data moving-source inference with the installed frozen model
      description: |
        Supply an existing download_id or an explicit archived real-data preset.
        Live inputs must provide at least three independent usable observations
        from one detector. Native images remain unchanged; analysis registers a
        separate bounded grid. At most 32 frames and a 512 by 512 grid are supported.
        The learned score prioritizes human review and is not a calibrated
        probability of a real object, a planet, or a new discovery.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MotionAnalysisRequest'
            example: {preset: comet-d6, options: {mask_policy: motion}}
      responses:
        '202':
          description: Durable analysis accepted; poll status or subscribe to events
          headers:
            Location:
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/AnalysisUnavailable'
  /api/analyses/models:
    get:
      tags: [Analyses]
      operationId: listInferenceModels
      summary: Describe the installed versioned model, checksum and score semantics
      responses:
        '200':
          description: Installed frozen model metadata
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/InferenceModel'
        '503':
          $ref: '#/components/responses/AnalysisUnavailable'
  /api/analyses/presets:
    get:
      tags: [Analyses]
      operationId: listRealAnalysisPresets
      summary: List archived real-observation sequences available for live inference
      description: |
        These selected known-object sequences are recovery/development examples,
        not a representative survey precision benchmark. Detection and model
        inference run on submission; results are not hardcoded target coordinates.
      responses:
        '200':
          description: Available real-data presets
          content:
            application/json:
              schema:
                type: object
                required: [presets]
                properties:
                  presets:
                    type: array
                    items:
                      type: object
                      required: [id, title, description, source_url]
                      properties:
                        id: {type: string}
                        title: {type: string}
                        description: {type: string}
                        source_url: {type: string, format: uri}
        '503':
          $ref: '#/components/responses/AnalysisUnavailable'
  /api/analyses/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Analyses]
      operationId: getMotionAnalysis
      summary: Get durable analysis state, computed candidates and review evidence
      responses:
        '200':
          description: Current analysis; failed tasks include a structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/analyses/{id}/events:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Analyses]
      operationId: watchMotionAnalysis
      summary: Stream analysis progress and terminal state as server-sent events
      description: |
        Sends a current-state snapshot, then analysis.updated and analysis.completed
        events. Event data is an AnalysisJob. A disconnected subscriber does not
        cancel an accepted analysis. Failure is a terminal job with an error.
      responses:
        '200':
          description: Ordered current-state and progress events
          content:
            text/event-stream:
              schema: {type: string}
        '404':
          $ref: '#/components/responses/NotFound'
  /api/analyses/{id}/resources/{name}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - name: name
        in: path
        required: true
        description: Exact published PNG filename returned in the analysis result
        schema: {type: string}
    get:
      tags: [Analyses]
      operationId: getAnalysisEvidence
      summary: Download an allowlisted image or stack of computed review evidence
      description: |
        Resources are available only after successful analysis publication.
        Images visualize measurements; evidence stacks are not calibrated
        significance maps or a substitute for native FITS scientific analysis.
      responses:
        '200':
          description: Published PNG review resource
          content:
            image/png:
              schema: {type: string, format: binary}
        '404':
          $ref: '#/components/responses/NotFound'
  /api/downloads/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Downloads]
      operationId: getDownload
      summary: Get job progress, resource links, errors, and final result
      description: |
        Returns the current manifest at any stage. A completed manifest is the
        final result. Each chunk includes its observation, status, and URLs.
        Counts include only discovered work; total may grow during discovery.
      responses:
        '200':
          $ref: '#/components/responses/ReadyJob'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/downloads/{id}/events:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Downloads]
      operationId: streamDownloadEvents
      summary: Stream discovery, readiness, failure, and completion events
      description: |
        Server-Sent Events. Each data payload contains job_id and may contain
        chunk_id, resource URLs, progress, or an error. Event names are
        job.updated, chunk.ready, chunk.failed, preview.ready, preview.failed,
        and job.completed. The first job.updated event provides the current
        manifest, including when connecting to an already completed job.
        job.completed is emitted after all requested work reaches a terminal
        state, including failure. Poll GET /api/downloads/{id} after reconnecting
        to recover the complete state. Disconnecting does not cancel the job.
      responses:
        '200':
          description: Event stream; the connection closes after job.completed
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: chunk.ready
                data: {"job_id":"job-123","chunk_id":"chunk-456","fits_cutout_url":"/api/chunks/chunk-456"}

                event: job.completed
                data: {"job_id":"job-123","status":"completed"}

        '404':
          $ref: '#/components/responses/NotFound'
  /api/chunks/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Chunks]
      operationId: getChunk
      summary: Download a prepared FITS chunk
      description: |
        A chunk is an internal piece of the requested region for an observation.
        All chunks together cover the requested available data. Metadata must
        explicitly describe missing coverage; a pending resource is not missing.
      responses:
        '200':
          description: Prepared FITS data
          content:
            application/fits:
              schema:
                type: string
                format: binary
        '202':
          $ref: '#/components/responses/PendingResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PreparationFailed'
  /api/chunks/{id}/preview:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Chunks]
      operationId: getChunkPreview
      summary: Get a prepared PNG preview
      description: |
        The preview URL is stable and may be returned before the image exists.
        preview_status or preview.ready determines when it can be displayed.
      responses:
        '200':
          description: Prepared preview image
          content:
            image/png:
              schema:
                type: string
                format: binary
        '202':
          $ref: '#/components/responses/PendingResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PreparationFailed'
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    RightAscension:
      name: right_ascension_deg
      in: query
      required: true
      description: ICRS right ascension of the region center, in degrees
      schema: {type: number, minimum: 0, exclusiveMaximum: 360}
    Declination:
      name: declination_deg
      in: query
      required: true
      description: ICRS declination of the region center, in degrees
      schema: {type: number, minimum: -90, maximum: 90}
    Width:
      name: width_arcmin
      in: query
      description: Full angular width in arcminutes, east-west in the local sky plane
      schema: {type: number, exclusiveMinimum: 0, default: 3}
    Height:
      name: height_arcmin
      in: query
      description: Full angular height in arcminutes, north-south in the local sky plane
      schema: {type: number, exclusiveMinimum: 0, default: 3}
    Detector:
      name: detector_array
      in: query
      schema:
        $ref: '#/components/schemas/DetectorSelection'
    Channel:
      name: channel_index
      in: query
      description: Optional spectral channel filter
      schema: {type: integer, minimum: 1, maximum: 102}
    ObservedAfter:
      name: observed_after
      in: query
      description: |
        Lower bound of the observation-time interval, as an ISO 8601 timestamp
        with a timezone. Converted to the lower MJD bound of IRSA TIME.
        Omit for an unbounded start. Must precede observed_before when both are set.
      schema:
        $ref: '#/components/schemas/ObservedAfter'
    ObservedBefore:
      name: observed_before
      in: query
      description: |
        Upper bound of the observation-time interval, as an ISO 8601 timestamp
        with a timezone. Converted to the upper MJD bound of IRSA TIME.
        Omit for an unbounded end. Must follow observed_after when both are set.
      schema:
        $ref: '#/components/schemas/ObservedBefore'
  responses:
    AnalysisUnavailable:
      description: Analysis admission is full or a required installed model/preset is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ReadyJob:
      description: Current job manifest; preparation may still be in progress
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Download'
    PendingJob:
      description: Job accepted; discovery and preparation continue in the background
      headers:
        Location:
          description: URL of GET /api/downloads/{id}
          schema: {type: string, format: uri-reference}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Download'
    PendingResource:
      description: Resource exists in the manifest but is still being prepared
      headers:
        Retry-After:
          description: Suggested delay before retrying, in seconds
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema:
            type: object
            required: [id, status]
            properties:
              id: {type: string}
              status: {type: string, enum: [pending]}
    NotFound:
      description: Unknown job, observation, or chunk
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidRequest:
      description: Invalid coordinates, sizes, filters, or unsupported request size
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ArchiveUnavailable:
      description: Archive search is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreparationFailed:
      description: Resource preparation failed; inspect the job manifest for details
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    SpectrumPreview:
      type: object
      required: [target, ra, dec, aperture_radius_pix, subtraction_mode, quality, scientifically_calibrated, download_id, total_channels, spectrum, warnings, molecular_detections, n_exposures_found, n_masked_or_outside, n_failed, n_download_failed, n_unmeasured, failures, detectors_summary, bad_pixel_mask, wcs_mode]
      properties:
        target: {type: string}
        candidate_id: {type: [string, 'null']}
        ra: {type: number}
        dec: {type: number}
        aperture_radius_pix: {type: number}
        subtraction_mode: {type: string, enum: [raw_calibrated, zodi_subtracted]}
        quality: {type: string, const: experimental_visualization_photometry}
        scientifically_calibrated: {type: boolean, const: false}
        download_id: {type: string}
        total_channels: {type: integer, minimum: 1, maximum: 120, description: Number of measured points, not distinct instrument channels}
        n_exposures_found: {type: integer, minimum: 0, description: Observations in the bounded native download manifest}
        n_masked_or_outside: {type: integer, minimum: 0}
        n_failed: {type: integer, minimum: 0, description: Inputs whose measurement failed}
        n_download_failed: {type: integer, minimum: 0}
        n_unmeasured: {type: integer, minimum: 0, description: Ready frames omitted by max_frames}
        bad_pixel_mask: {type: string}
        wcs_mode: {type: string}
        molecular_detections: {type: array, maxItems: 0, items: {type: object}}
        warnings: {type: array, items: {type: string}}
        failures:
          type: array
          items:
            type: object
            required: [frame_id, code]
            properties:
              frame_id: {type: string}
              code: {type: string}
        detectors_summary:
          type: object
          additionalProperties:
            type: object
            required: [range, mean_flux_mjy, mean_snr, channels]
            properties:
              range: {type: string}
              mean_flux_mjy: {type: number}
              mean_snr: {type: number}
              channels: {type: integer, minimum: 1}
        spectrum:
          type: array
          minItems: 1
          maxItems: 120
          items:
            type: object
            required: [channel, frame_id, detector, detector_array, wavelength_um, bandwidth_um, flux_mjy, uncertainty_mjy, snr, mjd, flagged]
            properties:
              channel: {type: integer, minimum: 1, description: Sequential measurement index only}
              frame_id: {type: string}
              detector: {type: string}
              detector_array: {type: integer, minimum: 1, maximum: 6}
              wavelength_um: {type: number, exclusiveMinimum: 0}
              bandwidth_um: {type: number, exclusiveMinimum: 0}
              flux_mjy: {type: number}
              uncertainty_mjy: {type: number, exclusiveMinimum: 0}
              snr: {type: number}
              mjd: {type: number}
              flagged: {type: boolean, const: false}
    ObservationMetadata:
      type: object
      required: [frame_id, status, observation, sia, tap, fits]
      properties:
        frame_id: {type: string}
        status: {type: string, enum: [complete, partial], description: Aggregate availability of the requested metadata sources}
        observation:
          $ref: '#/components/schemas/Observation'
        sia:
          $ref: '#/components/schemas/MetadataSource'
        tap:
          $ref: '#/components/schemas/MetadataSource'
        fits:
          $ref: '#/components/schemas/MetadataSource'
    MetadataSource:
      type: object
      required: [status]
      description: Source-specific metadata with availability, values, field definitions, HDU headers or an explicit error
      properties:
        status: {type: string, enum: [available, unavailable, not_found, not_downloaded, error, stale]}
        reason: {type: string}
        data:
          type: object
          additionalProperties: true
        fields:
          type: array
          items:
            type: object
            description: Original TAP field name, datatype, unit, description and available VO annotations
            additionalProperties: true
        rows:
          type: array
          items:
            type: object
            description: Typed TAP row; missing values are null
            additionalProperties: true
        hdus:
          type: array
          items:
            $ref: '#/components/schemas/FitsHdu'
        error:
          $ref: '#/components/schemas/Error'
      additionalProperties: true
    FitsHdu:
      type: object
      required: [index, type, bitpix, axes, cards]
      properties:
        index: {type: integer, minimum: 0}
        name: {type: [string, 'null']}
        type: {type: string}
        bitpix: {type: integer}
        axes:
          type: array
          items: {type: integer, minimum: 0}
        header_offset_bytes: {type: integer, minimum: 0}
        data_offset_bytes: {type: integer, minimum: 0}
        data_size_bytes: {type: integer, minimum: 0}
        cards:
          type: array
          description: Physical header cards in original order, including repeated COMMENT and HISTORY cards
          items:
            type: object
            required: [raw]
            properties:
              key: {type: [string, 'null']}
              value: {}
              comment: {type: [string, 'null']}
              raw: {type: string}
    EquipmentCatalogue:
      type: object
      required: [facility, instrument, release, detectors, calibration_products, catalogue_source, catalogue_complete]
      properties:
        facility: {type: string}
        instrument: {type: string}
        release: {type: string, enum: [DR1, QR3]}
        detectors:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentDetector'
        calibration_products:
          type: array
          items:
            $ref: '#/components/schemas/CalibrationProduct'
        catalogue_source: {type: string, format: uri}
        catalogue_complete: {type: boolean}
        catalogue_ttl_seconds: {type: integer, minimum: 0}
        catalogue_scope: {type: string}
        not_listed_product_types:
          type: array
          items: {type: string}
        frame_applicability: {type: string}
    EquipmentDetector:
      type: object
      required: [detector_array, wavelength_min_um, wavelength_max_um, resolving_power]
      properties:
        detector_array: {type: integer, minimum: 1, maximum: 6}
        wavelength_min_um: {type: number}
        wavelength_max_um: {type: number}
        resolving_power: {type: integer}
    CalibrationProduct:
      type: object
      required: [id, product_type, version, release, source_url, download_url, file_name, size_bytes, detector_relevance]
      properties:
        id: {type: string}
        product_type: {type: string}
        version: {type: string}
        detector_array: {type: [integer, 'null'], minimum: 1, maximum: 6}
        release: {type: string, enum: [DR1, QR3]}
        source_url: {type: string, format: uri}
        download_url: {type: string, format: uri-reference}
        file_name: {type: string}
        size_bytes: {type: integer, minimum: 1}
        detector_relevance: {type: string, enum: [single_detector, all_detectors]}
    MotionAnalysisRequest:
      type: object
      additionalProperties: false
      oneOf:
        - required: [download_id]
          not: {required: [preset]}
        - required: [preset]
          not: {required: [download_id]}
      properties:
        download_id:
          type: string
          minLength: 1
          maxLength: 128
          description: ID returned by a native default-mode observations preparation endpoint. Processed downloads are rejected to avoid applying zodiacal subtraction twice.
        preset:
          type: string
          enum: [comet-d6, comet-d2, vesta-d6, vesta-d3]
        options:
          $ref: '#/components/schemas/AnalysisOptions'
    AnalysisOptions:
      type: object
      additionalProperties: false
      properties:
        min_snr: {type: number, exclusiveMinimum: 0, maximum: 100, default: 4}
        min_speed_arcsec_per_hour: {type: number, exclusiveMinimum: 0, default: 3.075}
        max_speed_arcsec_per_hour: {type: number, exclusiveMinimum: 0, maximum: 100000, default: 369}
        mask_policy:
          type: string
          enum: [motion, science]
          default: motion
          description: |
            Motion retains OUTLIER pixels as explicitly flagged evidence.
            Science excludes them. Saturated BLOOM tracks are a separate
            non-photometric evidence stream and have no learned score.
        max_candidates: {type: integer, minimum: 1, maximum: 100, default: 100}
        max_peaks: {type: integer, minimum: 1, maximum: 100, default: 100}
        pixel_scale_arcsec: {type: number, minimum: 0.1, maximum: 60, default: 6.15}
        min_epochs: {type: integer, minimum: 3, maximum: 32, default: 3}
      description: Maximum speed must not be less than minimum speed. Caps are reported as incomplete-search warnings.
    InferenceModel:
      type: object
      required: [model_id, sha256, feature_names, score_kind]
      properties:
        model_id: {type: string}
        sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        feature_names: {type: array, items: {type: string}}
        score_kind: {type: string}
        status: {type: string}
        score_description: {type: string}
        training_manifest_sha256: {type: string}
        model_family: {type: string, enum: [RandomForestClassifier, ExtraTreesClassifier]}
        detector_profile:
          type: object
          description: Artifact-bound training detector defaults; request thresholds and speed options remain configurable.
          properties:
            psf_sigma: {type: number, enum: [0.8, 1.2]}
          additionalProperties: true
        algorithm_version_proposal: {type: string, description: Artifact-bound scientific algorithm identifier. Application versions remain Git revisions.}
      additionalProperties: true
    AnalysisJob:
      type: object
      required: [id, status, status_url, events_url]
      properties:
        id: {type: string}
        status:
          type: string
          enum: [queued, waiting_for_download, preparing, inferencing, completed, failed]
        download_id: {type: [string, 'null']}
        status_url: {type: string, format: uri-reference}
        events_url: {type: string, format: uri-reference}
        result:
          oneOf:
            - $ref: '#/components/schemas/AnalysisResult'
            - {type: 'null'}
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
            - {type: 'null'}
    AnalysisResult:
      type: object
      required: [schema_version, analysis_id, model, frames, candidates, settings, warnings, provenance, resources]
      properties:
        schema_version: {type: integer, const: 1}
        analysis_id: {type: string}
        model:
          $ref: '#/components/schemas/InferenceModel'
        frames:
          type: array
          minItems: 3
          maxItems: 32
          items:
            type: object
            required: [frame_id, observation_id, midpoint_utc, width, height, image_url, difference_url]
            properties:
              frame_id: {type: string}
              observation_id: {type: string}
              midpoint_utc: {type: string, format: date-time}
              width: {type: integer, minimum: 1, maximum: 512}
              height: {type: integer, minimum: 1, maximum: 512}
              image_url: {type: string, format: uri-reference}
              difference_url: {type: string, format: uri-reference}
              bloom_url: {type: string, format: uri-reference}
            additionalProperties: true
        candidates:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/MotionCandidate'
        settings: {type: object, additionalProperties: true}
        warnings: {type: array, items: {type: string}}
        provenance: {type: object, additionalProperties: true}
        resources:
          type: array
          items:
            type: object
            required: [name, media_type, size_bytes]
            properties:
              name: {type: string}
              media_type: {type: string, const: image/png}
              size_bytes: {type: integer, minimum: 1}
      additionalProperties: true
    MotionCandidate:
      type: object
      required: [id, rank, method, score, score_kind, baseline_rank, right_ascension_deg, declination_deg, speed_arcsec_per_hour, fit_rms_px, detections, warnings]
      properties:
        id: {type: string}
        rank: {type: integer, minimum: 1}
        method: {type: string, enum: [residual_track, bloom_track]}
        score:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Experimental model ranking score; null for non-ML saturated-source evidence
        score_kind: {type: string}
        baseline_rank: {type: integer, minimum: 1}
        baseline_score: {type: [number, 'null']}
        right_ascension_deg: {type: number, minimum: 0, exclusiveMaximum: 360}
        declination_deg: {type: number, minimum: -90, maximum: 90}
        coordinate_epoch_utc: {type: string, format: date-time}
        speed_arcsec_per_hour: {type: number, minimum: 0}
        fit_rms_px: {type: number, minimum: 0}
        detections:
          type: array
          minItems: 3
          items:
            type: object
            required: [frame_index, frame_id, midpoint_utc, x, y, right_ascension_deg, declination_deg, residual_snr, warnings]
            properties:
              frame_index: {type: integer, minimum: 0, maximum: 31}
              frame_id: {type: string}
              midpoint_utc: {type: string, format: date-time}
              x: {type: number, minimum: 0}
              y: {type: number, minimum: 0}
              right_ascension_deg: {type: number, minimum: 0, exclusiveMaximum: 360}
              declination_deg: {type: number, minimum: -90, maximum: 90}
              residual_snr: {type: [number, 'null']}
              warnings: {type: array, items: {type: string}}
            additionalProperties: true
        warnings: {type: array, items: {type: string}}
        moving_stack_url: {type: string, format: uri-reference}
        stationary_stack_url: {type: string, format: uri-reference}
      additionalProperties: true
    ObservedAfter:
      type: string
      format: date-time
      description: Observation-time lower bound; converted to MJD for IRSA TIME. Omit for an unbounded start.
      example: '2025-04-29T00:00:00Z'
    ObservedBefore:
      type: string
      format: date-time
      description: Observation-time upper bound; converted to MJD for IRSA TIME. Must follow observed_after. Omit for an unbounded end.
      example: '2025-04-30T00:00:00Z'
    DetectorSelection:
      default: all
      oneOf:
        - {type: integer, minimum: 1, maximum: 6}
        - {type: string, enum: [all]}
    SkyQuery:
      type: object
      required: [right_ascension_deg, declination_deg]
      properties:
        survey:
          type: string
          enum: [wide, deep]
          default: wide
          description: Survey selection; deep preparation always selects deep
        right_ascension_deg: {type: number, minimum: 0, exclusiveMaximum: 360}
        declination_deg: {type: number, minimum: -90, maximum: 90}
        width_arcmin: {type: number, exclusiveMinimum: 0, default: 3}
        height_arcmin: {type: number, exclusiveMinimum: 0, default: 3}
        detector_array:
          $ref: '#/components/schemas/DetectorSelection'
        channel_index: {type: integer, minimum: 1, maximum: 102}
        observed_after:
          $ref: '#/components/schemas/ObservedAfter'
        observed_before:
          $ref: '#/components/schemas/ObservedBefore'
    RangeQuery:
      type: object
      required:
        - right_ascension_min_deg
        - right_ascension_max_deg
        - declination_min_deg
        - declination_max_deg
      properties:
        survey:
          type: string
          enum: [wide, deep]
          default: wide
          description: Survey selection; deep preparation always selects deep
        right_ascension_min_deg: {type: number, minimum: 0, maximum: 360}
        right_ascension_max_deg: {type: number, minimum: 0, maximum: 360}
        declination_min_deg: {type: number, minimum: -90, maximum: 90}
        declination_max_deg: {type: number, minimum: -90, maximum: 90}
        detector_array:
          $ref: '#/components/schemas/DetectorSelection'
        channel_index: {type: integer, minimum: 1, maximum: 102}
        observed_after:
          $ref: '#/components/schemas/ObservedAfter'
        observed_before:
          $ref: '#/components/schemas/ObservedBefore'
    PolygonCoordinates:
      type: array
      minItems: 6
      items: {type: number}
      description: |
        Flat ICRS coordinate pairs in degrees: ra1,dec1,ra2,dec2,ra3,dec3,...
        Requires an even number of coordinates and a valid convex spherical polygon.
        RA/Dec ranges and geometry require backend validation.
    PolygonQuery:
      type: object
      required: [verices_degrees]
      properties:
        survey:
          type: string
          enum: [wide, deep]
          default: wide
          description: Survey selection; deep preparation always selects deep
        verices_degrees:
          $ref: '#/components/schemas/PolygonCoordinates'
        detector_array:
          $ref: '#/components/schemas/DetectorSelection'
        channel_index: {type: integer, minimum: 1, maximum: 102}
        observed_after:
          $ref: '#/components/schemas/ObservedAfter'
        observed_before:
          $ref: '#/components/schemas/ObservedBefore'
    Observation:
      type: object
      required: [frame_id, observation_date, detector_array, release, is_available]
      properties:
        frame_id: {type: string}
        observation_date: {type: string, format: date-time}
        detector_array: {type: integer, minimum: 1, maximum: 6}
        release: {type: string, enum: [DR1, QR3]}
        wavelength_min_um: {type: number}
        wavelength_max_um: {type: number}
        channel_index: {type: integer, minimum: 1, maximum: 102}
        is_available: {type: boolean}
        skip_reason: {type: string}
        header_metadata:
          type: object
          description: Available archive metadata; unavailable metrics are omitted
          additionalProperties: true
    Chunk:
      type: object
      required: [id, frame_id, status, preview_status, image_url, fits_cutout_url]
      properties:
        id: {type: string}
        frame_id: {type: string}
        status: {type: string, enum: [pending, ready, failed, unavailable]}
        preview_status: {type: string, enum: [pending, ready, failed, unavailable]}
        image_url: {type: string, format: uri-reference}
        fits_cutout_url: {type: string, format: uri-reference}
        region:
          $ref: '#/components/schemas/SkyQuery'
        error:
          $ref: '#/components/schemas/Error'
    Download:
      type: object
      required: [id, status, mode, query, observations, chunks, progress, status_url, events_url]
      properties:
        id: {type: string}
        status:
          type: string
          enum: [queued, discovering, preparing, completed, completed_with_errors, failed]
        mode:
          type: string
          enum: [default, zodi_reference_subtracted, epoch_difference]
        query:
          description: Original request geometry and filters for this download job
          oneOf:
            - $ref: '#/components/schemas/SkyQuery'
            - $ref: '#/components/schemas/RangeQuery'
            - $ref: '#/components/schemas/PolygonQuery'
        reference_frame_id: {type: string}
        observations:
          type: array
          description: May be empty while archive discovery is in progress
          items:
            $ref: '#/components/schemas/Observation'
        chunks:
          type: array
          description: Discovered chunks; new entries may arrive during discovery
          items:
            $ref: '#/components/schemas/Chunk'
        progress:
          type: object
          required: [discovery_complete, total_chunks, ready_chunks, failed_chunks, unavailable_chunks]
          properties:
            discovery_complete: {type: boolean}
            total_chunks: {type: integer, minimum: 0}
            ready_chunks: {type: integer, minimum: 0}
            failed_chunks: {type: integer, minimum: 0}
            unavailable_chunks: {type: integer, minimum: 0}
        status_url: {type: string, format: uri-reference}
        events_url: {type: string, format: uri-reference}
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        retryable: {type: boolean}
