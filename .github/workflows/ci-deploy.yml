name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ml/pvusatov/backend/inference/requirements-training.txt
            pipeline/requirements-http-test.txt
      - name: Install locked scientific test dependencies
        working-directory: ml/pvusatov/backend/inference
        run: python -m pip install --require-hashes -r requirements-training.txt
      - name: Test frozen model and scientific pipeline
        working-directory: ml/pvusatov/backend/inference
        run: |
          python -m pytest
          python -m pytest experiments
          python smoke.py
      - name: Verify immutable v2 release and source archive
        working-directory: ml/pvusatov/releases/v2/backend/inference
        run: |
          python -m pytest
          python smoke.py
      - name: Verify final evaluation guards and selected v3 release
        working-directory: .
        run: |
          # The original hash-bound review tests retain their external DEV-cache
          # prerequisites. Portable guard equivalents use the archived snapshot.
          python -m pytest -q ml/pvusatov/verification/final ml/pvusatov/releases/v3/test_smoke.py --ignore=ml/pvusatov/verification/final/test_summarize_results.py
          python ml/pvusatov/verification/final/audit_snapshot.py
          python ml/pvusatov/releases/v3/smoke.py
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt
          cache-dependency-path: |
            backend/build.sbt
            backend/project/build.properties
      - name: Install and test pipeline HTTP processing
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --only-binary=:all: --require-hashes -r pipeline/requirements-http-test.txt
          python -m pytest pipeline/tests -q
          printf 'PROCESSING_PYTHON=%s\n' "$(command -v python)" >> "$GITHUB_ENV"
      - name: Test and stage Scala API
        run: ./sbtw test stage
      - name: Check deployment scripts
        run: |
          bash -n ../ops/deploy.sh ../ops/ci-ssh.sh ../ops/bootstrap-vps.sh ../ops/test-ci-ssh.sh tests/test_deploy.sh
          bash ../ops/test-ci-ssh.sh
      - name: Build the exact commit
        run: docker build --file Dockerfile --build-arg "APP_REVISION=$GITHUB_SHA" --tag "spaceapps-api:$GITHUB_SHA" ..
      - name: Verify packaged real-data inference
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            --entrypoint /opt/inference-venv/bin/python \
            "spaceapps-api:$GITHUB_SHA" /app/inference/smoke.py
          docker run --rm --read-only --tmpfs /tmp \
            --entrypoint /opt/inference-venv/bin/python \
            "spaceapps-api:$GITHUB_SHA" /app/inference/release-smoke.py --model-dir /app/inference/models
      - name: Test container deployment and rollback
        env:
          TEST_IMAGE_REVISION: ${{ github.sha }}
        run: bash tests/test_deploy.sh
      - name: Verify upgrade from the existing VPS Compose file
        env:
          TEST_IMAGE_REVISION: ${{ github.sha }}
          TEST_COMPOSE_FILE: tests/fixtures/legacy-compose.yaml
        run: bash tests/test_deploy.sh
      - name: Deploy main to VPS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          VPS_HOST: 144.124.238.101
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/vps_deploy_key"
          known_hosts="$RUNNER_TEMP/vps_known_hosts"
          archive="$RUNNER_TEMP/api-image.tar"
          trap 'rm -f "$key" "$known_hosts" "$archive"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$known_hosts"
          docker image save "spaceapps-api:$GITHUB_SHA" > "$archive"
          ssh_options=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts"
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          # Keep the tar uncompressed on both ends so rsync can reuse unchanged
          # Docker layers; compress only the changed blocks on the wire.
          printf -v rsync_ssh '%q ' ssh "${ssh_options[@]}"
          rsync --inplace --no-whole-file --compress --partial --checksum --stats \
            --rsync-path=sync-image -e "$rsync_ssh" \
            "$archive" "$VPS_USER@$VPS_HOST:/opt/spaceapps/incoming-image.tar"
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "deploy-cached $GITHUB_SHA"
          python - <<'PY'
          import json
          import os
          import urllib.request
          url = f"http://{os.environ['VPS_HOST']}/version"
          with urllib.request.urlopen(url, timeout=15) as response:
              version = json.load(response)['version']
          assert version == os.environ['GITHUB_SHA'], (version, os.environ['GITHUB_SHA'])
          print(f"Public endpoint verified: {version}")
          PY
