name: Backend deploy (agents wait)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: false

# This workflow is the release completion gate. Tests run independently.
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the exact commit
        run: docker build --file Dockerfile --build-arg "APP_REVISION=$GITHUB_SHA" --tag "spaceapps-api:$GITHUB_SHA" ..
      - name: Deploy main to VPS
        env:
          VPS_HOST: 146.103.122.246
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/vps_deploy_key"
          known_hosts="$RUNNER_TEMP/vps_known_hosts"
          trap 'rm -f "$key" "$known_hosts"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$known_hosts"
          ssh_options=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts"
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          # Stream directly: a cached tar plus Docker's extraction workspace
          # exceeds the constrained VPS disk budget during an image update.
          docker image save "spaceapps-api:$GITHUB_SHA" | gzip -1 | \
            ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "deploy $GITHUB_SHA"
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          url = f"http://{os.environ['VPS_HOST']}/version"
          with urllib.request.urlopen(url, timeout=15) as response:
              version = json.load(response)['version']
          assert version == os.environ['GITHUB_SHA'], (version, os.environ['GITHUB_SHA'])
          with urllib.request.urlopen(f"http://{os.environ['VPS_HOST']}/api/capabilities", timeout=15) as response:
              capabilities = json.load(response)
          assert capabilities['revision'] == version
          assert capabilities['pipeline']['available'], 'Processing worker is unavailable'
          assert capabilities['motion_models']['models'], 'No installed inference model'
          assert capabilities['native_epoch_difference']['status'] == 'unsupported'
          # Validate the actual UI route without depending on external TAP availability.
          try:
              urllib.request.urlopen(f"http://{os.environ['VPS_HOST']}/api/motion/catalog?ra=NaN&dec=0", timeout=15)
              raise AssertionError('Invalid catalogue coordinates were accepted')
          except urllib.error.HTTPError as error:
              assert error.code == 422
              assert json.load(error)['code'] == 'invalid_request'
          # Whichever independent deployment finishes last checks nginx too.
          frontend = f"http://{os.environ['VPS_HOST']}:8080"
          with urllib.request.urlopen(frontend + '/frontend-version.json', timeout=15) as response:
              frontend_revision = json.load(response)['version']
          if frontend_revision == version:
              try:
                  urllib.request.urlopen(frontend + '/api/motion/catalog?ra=NaN&dec=0', timeout=15)
                  raise AssertionError('Frontend catalogue route accepted invalid coordinates')
              except urllib.error.HTTPError as error:
                  assert error.code == 422
                  assert json.load(error)['code'] == 'invalid_request'
          else:
              print('Frontend still deploying; frontend deployment will check the joint route')
          print(f"Public endpoint, processing worker, model and catalogue route verified: {version}")
          PY
