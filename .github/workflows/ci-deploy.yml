name: Backend deploy (agents wait)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: false

# This workflow is the release completion gate. Tests run independently.
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the exact commit
        run: docker build --file Dockerfile --build-arg "APP_REVISION=$GITHUB_SHA" --tag "spaceapps-api:$GITHUB_SHA" ..
      - name: Deploy main to VPS
        env:
          VPS_HOST: 144.124.238.101
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/vps_deploy_key"
          known_hosts="$RUNNER_TEMP/vps_known_hosts"
          archive="$RUNNER_TEMP/api-image.tar"
          trap 'rm -f "$key" "$known_hosts" "$archive"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$known_hosts"
          docker image save "spaceapps-api:$GITHUB_SHA" > "$archive"
          ssh_options=(-i "$key" -o IdentitiesOnly=yes -o BatchMode=yes
            -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known_hosts"
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          # Keep the tar uncompressed on both ends so rsync can reuse unchanged
          # Docker layers; compress only the changed blocks on the wire.
          printf -v rsync_ssh '%q ' ssh "${ssh_options[@]}"
          rsync --inplace --no-whole-file --compress --partial --checksum --stats \
            --rsync-path=sync-image -e "$rsync_ssh" \
            "$archive" "$VPS_USER@$VPS_HOST:/opt/spaceapps/incoming-image.tar"
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "deploy-cached $GITHUB_SHA"
          python - <<'PY'
          import json
          import os
          import urllib.request
          url = f"http://{os.environ['VPS_HOST']}/version"
          with urllib.request.urlopen(url, timeout=15) as response:
              version = json.load(response)['version']
          assert version == os.environ['GITHUB_SHA'], (version, os.environ['GITHUB_SHA'])
          print(f"Public endpoint verified: {version}")
          PY
