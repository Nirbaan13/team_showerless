name: Hostinger deploy (agents wait)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-hostinger:
    if: github.ref == 'refs/heads/main'
    name: Build & Sync to spherexblink.tech
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build Frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          python3 - <<'PYREV'
          import json, os
          from pathlib import Path
          Path('dist/frontend-version.json').write_text(json.dumps({'version': os.environ['GITHUB_SHA']}))
          PYREV
          if [ -f public/.htaccess ]; then
            cp public/.htaccess dist/.htaccess
          fi

      - name: Deploy to Hostinger Live Site via FTPS
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: python3 ops/deploy_hostinger.py

      - name: Verify public revision and API delivery
        run: |
          python3 - <<'PYVERIFY'
          import json, os, time, urllib.request
          base = 'https://spherexblink.tech'
          def read(path):
              request = urllib.request.Request(base + path, headers={'Cache-Control': 'no-cache'})
              with urllib.request.urlopen(request, timeout=15) as response:
                  assert response.headers.get_content_type() == 'application/json', (path, response.headers.get_content_type())
                  return json.load(response)
          deadline = time.monotonic() + 600
          while True:
              try:
                  assert read('/frontend-version.json')['version'] == os.environ['GITHUB_SHA']
                  assert isinstance(read('/api/catalogue/kpis'), dict)
                  assert isinstance(read('/api/motion/verifications'), list)
                  assert read('/backend/health')['status'] == 'ok'
                  break
              except Exception as error:
                  if time.monotonic() >= deadline:
                      raise
                  print(f'Waiting for public API delivery: {error}', flush=True)
                  time.sleep(5)
          print('Public frontend revision and JSON API routes verified.')
          PYVERIFY
