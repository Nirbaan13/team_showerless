name: Backend tests (agents do not wait)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/pvusatov/backend/inference/requirements-training.txt
      - name: Install locked scientific test dependencies
        working-directory: ml/pvusatov/backend/inference
        run: python -m pip install --require-hashes -r requirements-training.txt
      - name: Install locked pipeline and HTTP test dependencies
        run: python -m pip install --require-hashes -r python/requirements-pipeline.txt -r python/requirements-tests.txt
      - name: Test image unification and private worker lifecycle
        working-directory: .
        env:
          PYTHONPATH: pipeline:ml/pvusatov/backend/inference
        run: python -m pytest -q pipeline/tests
      - name: Test frozen model and scientific pipeline
        working-directory: ml/pvusatov/backend/inference
        run: |
          python -m pytest
          python -m pytest experiments
          python smoke.py
      - name: Verify immutable v2 release and source archive
        working-directory: ml/pvusatov/releases/v2/backend/inference
        run: |
          python -m pytest
          python smoke.py
      - name: Verify final evaluation guards and selected v3 release
        working-directory: .
        run: |
          # The original hash-bound review tests retain their external DEV-cache
          # prerequisites. Portable guard equivalents use the archived snapshot.
          python -m pytest -q ml/pvusatov/verification/final ml/pvusatov/releases/v3/test_smoke.py --ignore=ml/pvusatov/verification/final/test_summarize_results.py
          python ml/pvusatov/verification/final/audit_snapshot.py
          python ml/pvusatov/releases/v3/smoke.py
      - name: Test experimental v4 scientific tools
        working-directory: .
        run: PYTHONPATH=.:ml/pvusatov/backend/inference python -m pytest -q ml/pvusatov/experiments/v4 ml/pvusatov/releases/v4
      - name: Recount every frozen v4 field without external inputs
        working-directory: .
        run: |
          python ml/pvusatov/verification/v4-final-repair-1/portable-audit/verify.py --deny-external-inputs --probe-denial
          python -m pytest -q ml/pvusatov/verification/v4-final-repair-1/portable-audit/test_verifier.py
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt
          cache-dependency-path: |
            backend/build.sbt
            backend/project/build.properties
      - name: Test and stage Scala API
        env:
          UNIFICATION_PYTHON: python
        run: ./sbtw test stage
      - name: Check deployment scripts
        run: |
          bash -n ../ops/deploy.sh ../ops/ci-ssh.sh ../ops/bootstrap-vps.sh ../ops/bootstrap-domain.sh ../ops/test-ci-ssh.sh ../ops/test-deploy-binding.sh tests/test_deploy.sh
          bash ../ops/test-ci-ssh.sh
          bash ../ops/test-deploy-binding.sh
          bash ../ops/test-host-overrides.sh
          bash ../ops/lowmemory/test-prune-images.sh
          bash ../ops/lowmemory/test-config.sh
      - name: Verify domain routing, TLS and streaming
        working-directory: .
        run: |
          caddy_container=$(docker create caddy:2.11.9@sha256:4e2425f6009577e7c651010f16679c28f7d12df3e7b1914f941a7a3370746b3c)
          trap 'docker rm "$caddy_container" >/dev/null' EXIT
          docker cp "$caddy_container:/usr/bin/caddy" "$RUNNER_TEMP/caddy"
          chmod +x "$RUNNER_TEMP/caddy"
          PATH="$RUNNER_TEMP:$PATH" python3 ops/domain/test-routing.py
      - name: Build the exact commit
        run: docker build --file Dockerfile --build-arg "APP_REVISION=$GITHUB_SHA" --tag "spaceapps-api:$GITHUB_SHA" ..
      - name: Verify packaged real-data inference
        run: |
          docker run --rm --read-only --tmpfs /tmp \
            --entrypoint /opt/inference-venv/bin/python \
            "spaceapps-api:$GITHUB_SHA" /app/inference/release-smoke.py --model-dir /app/inference/models
      - name: Test container deployment and rollback
        env:
          TEST_IMAGE_REVISION: ${{ github.sha }}
        run: bash tests/test_deploy.sh
      - name: Verify upgrade from the existing VPS Compose file
        env:
          TEST_IMAGE_REVISION: ${{ github.sha }}
          TEST_COMPOSE_FILE: tests/fixtures/legacy-compose.yaml
        run: bash tests/test_deploy.sh
