name: Frontend tests (agents do not wait)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Lint and build frontend
        working-directory: frontend
        env:
          VITE_BACKEND_URL: /backend
        run: |
          npm run lint
          npm run build
      - name: Install browser for viewer regression tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Test real viewer states and epoch difference rendering
        working-directory: frontend
        run: npm test
      - name: Check frontend deployment scripts
        run: bash -n ops/deploy-frontend.sh ops/bootstrap-frontend.sh ops/frontend/test-deploy.sh
      - name: Build exact frontend revision
        run: docker build --file ops/frontend/Dockerfile --build-arg "APP_REVISION=$GITHUB_SHA" --tag "spaceapps-frontend:$GITHUB_SHA" .
      - name: Verify frontend deployment and rollback
        env:
          TEST_IMAGE_REVISION: ${{ github.sha }}
        run: bash ops/frontend/test-deploy.sh
