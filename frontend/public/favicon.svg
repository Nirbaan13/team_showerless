<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Outer tactile rounded badge -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#0a0a0e" stroke="#10b981" stroke-width="2.5"/>
  
  <!-- Optical telescope crosshairs -->
  <line x1="24" y1="5" x2="24" y2="13" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="35" x2="24" y2="43" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="5" y1="24" x2="13" y2="24" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="35" y1="24" x2="43" y2="24" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

  <!-- Clean central aperture reticle -->
  <circle cx="24" cy="24" r="11" stroke="#34d399" stroke-width="1.8" stroke-dasharray="3 3"/>

  <!-- Glowing detected object core -->
  <circle cx="24" cy="24" r="5" fill="#fbbf24" fill-opacity="0.3"/>
  <circle cx="24" cy="24" r="3.2" fill="#f59e0b"/>
  <circle cx="24" cy="24" r="1.3" fill="#ffffff"/>
</svg>