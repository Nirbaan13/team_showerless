<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Outer tactile rounded badge -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#0a0a0e" stroke="#10b981" stroke-width="2.5"/>
  
  <!-- Optical telescope crosshairs -->
  <line x1="24" y1="6" x2="24" y2="12" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="36" x2="24" y2="42" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="6" y1="24" x2="12" y2="24" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="24" x2="42" y2="24" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>

  <!-- Multi-epoch orbital trail arc -->
  <path d="M 12 34 C 15 20, 24 14, 35 13" stroke="#34d399" stroke-width="2" stroke-dasharray="2 3" stroke-linecap="round"/>

  <!-- Blink motion epoch dots -->
  <circle cx="14" cy="31" r="2" fill="#059669" opacity="0.6"/>
  <circle cx="21" cy="22" r="2.5" fill="#10b981" opacity="0.85"/>
  <circle cx="29" cy="16" r="3" fill="#34d399"/>
  
  <!-- Current active moving object with infrared flash glow -->
  <circle cx="36" cy="13" r="5" fill="#fbbf24" fill-opacity="0.25"/>
  <circle cx="36" cy="13" r="3.5" fill="#f59e0b"/>
  <circle cx="36" cy="13" r="1.5" fill="#ffffff"/>
</svg>